name: War economy info

on:
  push:
    branches:
      - war-economy-goals-20260908

permissions:
  contents: write

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: war-economy-goals-20260908
          fetch-depth: 0

      - name: Apply info patch
        run: python .github/patch_war_economy_info.py

      - name: Verify text and existing economy logic
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('index.html').read_text(encoding='utf-8')
          required=[
            'Guerreiro 50 • Rei 300 • Dragão 450 • Golem 550 • Mago 550 gemas.',
            'Rodada: vencedor +200 • perdedores +100 • empate +100 para todos.',
            'Metas: 5 especiais +70 • 3 ataques à distância +40 gemas.',
            'const WAR_UNIT_COSTS=Object.freeze({warrior:50,king:300,golem:550,mage:550,dragon:450});',
            'const WAR_ROUND_GEM_REWARD=Object.freeze({winner:200,loser:100,tie:100});',
            'const WAR_GOALS=Object.freeze({specials:{target:5,reward:70},ranged:{target:3,reward:40}});',
          ]
          for marker in required:
              if marker not in t:
                  raise SystemExit('missing marker: '+marker)
          if 'Guerreiro 75 • Dragão 350 • Golem 350 • Mago 550 gemas.' in t:
              raise SystemExit('old economy info still present')
          import subprocess
          names=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          if names != ['index.html']:
              raise SystemExit('unexpected patched files: '+repr(names))
          PY

      - name: Commit validated info change
        run: |
          git config user.name islandzombieslz
          git config user.email island.zombie.slz@gmail.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Update war economy information"
          git push origin HEAD:war-economy-goals-20260908
