name: Egypt summons and Brown King damage
on:
  push:
    paths:
      - '.github/workflows/egypt-summons-brown-king-damage.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Refresh branch
        run: git pull --rebase origin main
      - name: Apply balance patch
        run: python .github/fix_egypt_summons_brown_king_damage_20260913.py
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',t,re.S)
          if not scripts: raise SystemExit('No inline script found')
          Path('/tmp/rampage-main.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/rampage-main.js
      - name: Validate requested values
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          t=Path('index.html').read_text(encoding='utf-8')
          required=[
            'EGYPT SUMMON HALF HP + BROWN KING DAMAGE 2026-09-13',
            'for(let i=0;i<2;i++){',
            'const angle=base+Math.PI*i;',
            "const halfHp=Math.max(1,Math.round((Number(summon.maxHp)||Number(summon.hp)||1)*.5));",
            'summon.maxHp=halfHp;',
            'summon.hp=halfHp;',
            'summon.shield=0;',
            'summon.maxShield=0;',
            'const BROWN_NORMAL_DAMAGE_1=52;',
            'const BROWN_NORMAL_DAMAGE_2=37;',
            'const BROWN_SPECIAL_DAMAGE=37;',
            'const KING_SPECIAL_DAMAGE=62;',
            'e.damage=47;'
          ]
          missing=[x for x in required if x not in t]
          if missing: raise SystemExit('Missing: '+repr(missing))
          forbidden=[
            'for(let i=0;i<3;i++){',
            'const BROWN_NORMAL_DAMAGE_1=40;',
            'const BROWN_NORMAL_DAMAGE_2=25;',
            'const BROWN_SPECIAL_DAMAGE=25;',
            'const KING_SPECIAL_DAMAGE=50;'
          ]
          present=[x for x in forbidden if x in t]
          if present: raise SystemExit('Old values remain: '+repr(present))
          # Scope-check King normal damage so the generic value must be 47 in spawnKing.
          start=t.index('function spawnKing(')
          end=t.index('function spawnGolem(',start)
          king=t[start:end]
          if 'e.damage=47;' not in king or 'e.damage=35;' in king:
            raise SystemExit('King normal damage scope invalid')
          # Summoned Egypt Warrior bar is full because hp equals reduced maxHp.
          start=t.index('function spawnEgyptMageWarriors(')
          end=t.index('function updateMageAttackState(',start)
          summon=t[start:end]
          if summon.count('spawnWarrior(')!=1 or 'summon.hp=halfHp;' not in summon or 'summon.maxHp=halfHp;' not in summon:
            raise SystemExit('Egypt summon HP setup invalid')
          print('Validation passed: Egypt=2 summons at 50% max HP/full bar; Brown=52/37/37; King=47/62')
          PY
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Balance Egypt summons Brown Warrior and King'
          git push origin main
