name: One-time History validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-history-validation.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Run game regression checks
        run: |
          node tests/history-smoke.cjs
          node tests/pvp-smoke.cjs
          node tests/progression-smoke.cjs
      - name: Validate Cloudflare Worker
        working-directory: history-server
        run: |
          npm install
          npx wrangler deploy --dry-run
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/one-time-history-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/one-time-history-validation.yml
          git commit -m "Remove temporary History validation workflow"
          git push origin HEAD:main
