name: Inspect audio stage

on:
  push:
    paths:
      - '.github/workflows/inspect-audio-stage.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect staged audio chunks
        shell: bash
        run: |
          set -u
          echo '=== files ==='
          find .audio-stage -maxdepth 1 -type f -printf '%f %s\n' | sort
          for prefix in menu12 menu16 tema batalha; do
            mapfile -t files < <(find .audio-stage -maxdepth 1 -type f -name "${prefix}*.b64" | sort)
            [ ${#files[@]} -gt 0 ] || continue
            echo "=== $prefix (${#files[@]} chunks) ==="
            cat "${files[@]}" > "/tmp/${prefix}.b64"
            if base64 -d "/tmp/${prefix}.b64" > "/tmp/${prefix}.mp3" 2>"/tmp/${prefix}.err"; then
              wc -c "/tmp/${prefix}.mp3"
              sha256sum "/tmp/${prefix}.mp3"
              file "/tmp/${prefix}.mp3"
              ffprobe -v error -show_entries format=duration,bit_rate -of default=noprint_wrappers=1 "/tmp/${prefix}.mp3" || true
            else
              echo 'base64 decode failed:'
              cat "/tmp/${prefix}.err"
            fi
          done
