name: One-time boot diagnostic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-boot-diagnostic.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Serve game
        run: |
          python3 -m http.server 8080 >/tmp/http.log 2>&1 &
          sleep 2
      - name: Reproduce boot in Chromium
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          echo "CHROME=$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage             --enable-logging=stderr --v=1 --virtual-time-budget=12000             --dump-dom http://127.0.0.1:8080/ >/tmp/dom.html 2>/tmp/chrome.log || true
          echo "=== BOOT DOM ==="
          grep -o -E 'CARREGANDO|VERIFICANDO ARQUIVOS|PREPARANDO CACHE|PRONTO|bootLoader[^<]*' /tmp/dom.html | head -30 || true
          echo "=== JS / CONSOLE ERRORS ==="
          grep -E -i 'Uncaught|ReferenceError|TypeError|SyntaxError|CONSOLE|ERROR' /tmp/chrome.log | tail -120 || true
          echo "=== HTTP LOG ==="
          tail -80 /tmp/http.log || true
