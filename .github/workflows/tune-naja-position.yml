name: Tune Naja Position and Warrior Balance

on:
  push:
    branches: [main]
    paths:
      - '.github/tune_naja_special_behavior.py'
      - '.github/tune_warrior_balance.py'
      - '.github/workflows/tune-naja-position.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rampage-tune-naja-position
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh branch
        run: git pull --rebase origin main

      - name: Apply Naja render position
        run: python .github/tune_naja_special_behavior.py

      - name: Apply warrior balance
        run: python .github/tune_warrior_balance.py

      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script>(.*?)</script>',html,re.S)
          if not blocks:
              raise SystemExit('No classic script block found')
          Path('/tmp/rampage-main.js').write_text(blocks[-1],encoding='utf-8')
          PY
          node --check /tmp/rampage-main.js

      - name: Validate changes
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('index.html').read_text(encoding='utf-8')
          required=[
            "const renderX=e.type==='naja'?sx+14*zoom:e.type==='anubis'?sx+(16*anubisFace)*zoom:sx;",
            "const renderY=e.type==='naja'?sy+16*zoom:e.type==='anubis'?sy+18*zoom:sy;",
            "el.style.left=renderX+'px'",
            '.entity-visual.naja-visual .entity-body{',
            'left:-8px;',
            'top:-8px;',
            'return phase!==null;',
            'e.najaShieldSpecialUsed=false;',
            'const najaNeedsSpecial=!!e.najaShieldSpecialPending||(Number(e.najaNormalCount)||0)>=4;',
            'warrior:100',
            'king:500',
            'Comprar Guerreiro por 100 gemas',
            'Comprar Guerreiro do Egito por 100 gemas',
            'Comprar Rei Guerreiro por 500 gemas',
            'const WAR_BASIC_WARRIOR_SPEED_MULTIPLIER=.92;',
            "e.attackCooldown=e.type==='king'?.65:e.type==='warrior'?.70:.50;",
            'e.damage=33;',
            'e.hp=e.maxHp=650;',
            'e.shield=e.maxShield=250;',
            'e.hp=e.maxHp=265;',
            'e.shield=e.maxShield=165;',
            "e.type==='brownWarrior'?1.16",
            'applyCombatHit(target,e,50,{',
            'applyCombatHit(t,e,80,{',
            'const MAGE_SPECIAL_HEAL=50;',
            'const WAR_SPECIAL_OPENING_INVULN_MS=2000;',
            'if(warSpecialOpeningInvulnerable(target))return;'
          ]
          missing=[x for x in required if x not in t]
          if missing:
              raise SystemExit('Missing Naja/warrior tuning: '+repr(missing))
          print('Naja/Anubis render and war balance validation passed')
          PY
          git diff --check

      - name: Publish
        run: |
          if git diff --quiet -- index.html; then
            echo 'No game change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Rebalance war units and special protection'
          git push origin main
