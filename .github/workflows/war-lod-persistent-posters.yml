name: Persistent war LOD posters
on:
  push:
    paths:
      - '.github/workflows/war-lod-persistent-posters.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh branch
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Apply persistent poster cache
        run: python .github/patch_war_lod_persistent_posters.py
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          for i,(attrs,code) in enumerate(re.findall(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I)):
              ext='.mjs' if 'type="module"' in attrs or "type='module'" in attrs else '.js'
              Path(f'/tmp/lod-{i}{ext}').write_text(code,encoding='utf-8')
          PY
          for f in /tmp/lod-*; do node --check "$f"; done
      - name: Validate
        run: |
          grep -q 'WAR LOD PERSISTENT POSTERS 2026-09-12' index.html
          grep -q "WAR_LOD_POSTER_CACHE='rampage-war-lod-posters-v1'" index.html
          grep -q 'loadCachedWarLodPoster' index.html
          grep -q 'BOOT_ASSET_MANIFEST?.\[src\]' index.html
          grep -q 'WAR VISUAL LOD ACTIVE 2026-09-12' index.html
          ! grep -q 'golemCrowdSpecialUsed' index.html
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Persist adaptive war LOD posters' || exit 0
          git push origin HEAD:main
