name: Refresh PvP HUD asset cache

on:
  push:
    branches: [pvp-hud-visual-refresh]
    paths:
      - '.github/workflows/refresh-pvp-hud-cache.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pvp-hud-visual-refresh
          fetch-depth: 0
      - name: Regenerate asset manifest and service worker
        run: |
          set -euo pipefail
          python .github/update_asset_cache.py
          python - <<'PY'
          import re
          from pathlib import Path
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S)
          Path('/tmp/rampage-main.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/rampage-main.js
          node --check sw.js
      - name: Commit refreshed cache
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          if git diff --cached --quiet; then
            echo 'Cache already current.'
            exit 0
          fi
          git commit -m 'Refresh cache for PvP HUD assets'
          git push origin HEAD:pvp-hud-visual-refresh
