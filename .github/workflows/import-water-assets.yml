name: Import Water Clan Assets
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-water-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Download and verify local water assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/water/poseidon assets/water/seahorse
          fetch_image() {
            local url="$1" dest="$2"
            curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 180 -A 'Mozilla/5.0' "$url" -o "$dest"
            test -s "$dest"
            FILE="$dest" python - <<'PY'
import os, pathlib
p=pathlib.Path(os.environ['FILE'])
b=p.read_bytes()
if p.suffix=='.gif':
    assert b[:6] in (b'GIF87a',b'GIF89a'),f'Invalid GIF: {p}'
    assert b[-1]==0x3b,f'Incomplete GIF: {p}'
elif p.suffix=='.png':
    assert b.startswith(bytes.fromhex('89504e470d0a1a0a')),f'Invalid PNG: {p}'
    assert b'IEND' in b[-32:],f'Incomplete PNG: {p}'
else:
    raise AssertionError(f'Unexpected extension: {p}')
assert len(b)>1000,(p,len(b))
print(p,len(b))
PY
          }
          fetch_image 'https://i.postimg.cc/Y9Z4vtvs/card-poseidon.png' 'assets/water/poseidon/card.png'
          fetch_image 'https://i.postimg.cc/sDFQyDdW/Parado.gif' 'assets/water/poseidon/idle.gif'
          fetch_image 'https://i.postimg.cc/hj6JXKXb/andando.gif' 'assets/water/poseidon/walk.gif'
          fetch_image 'https://i.postimg.cc/JnvysRs6/ataque-especial.gif' 'assets/water/poseidon/special-wave.gif'
          fetch_image 'https://i.postimg.cc/kGS28L89/ataque-especial-2.gif' 'assets/water/poseidon/special-summon.gif'
          fetch_image 'https://i.postimg.cc/26Mq1CqD/ataque-normal.gif' 'assets/water/poseidon/normal.gif'
          fetch_image 'https://i.postimg.cc/xTrJYTDJ/poder-da-onda.gif' 'assets/water/poseidon/wave.gif'
          fetch_image 'https://i.postimg.cc/D0GSsRsy/card-cavalo-marinho.png' 'assets/water/seahorse/card.png'
          fetch_image 'https://i.postimg.cc/CLjZKTSk/cavalo-andando.gif' 'assets/water/seahorse/walk.gif'
          fetch_image 'https://i.postimg.cc/3Jgyw5Yp/cavalo-parado.gif' 'assets/water/seahorse/idle.gif'
          fetch_image 'https://i.postimg.cc/5NwHtdbw/cavalo-ataque.gif' 'assets/water/seahorse/attack.gif'
          git add assets/water/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Import local Water clan artwork"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
