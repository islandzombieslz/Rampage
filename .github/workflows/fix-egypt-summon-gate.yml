name: Guard Egypt summon special

on:
  push:
    branches: [main]
    paths:
      - '.github/fix_egypt_summon_gate.py'
      - '.github/workflows/fix-egypt-summon-gate.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh branch
        run: git pull --rebase origin main

      - name: Apply guard
        run: python .github/fix_egypt_summon_gate.py

      - name: Check JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', text, re.S)
          if not scripts:
              raise SystemExit('No classic script block found')
          Path('/tmp/rampage-main.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/rampage-main.js

      - name: Validate guard
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          required = [
              'function hasPendingEgyptSummonSpecial(team,excludeId=null)',
              "summonsAlive<=1&&!hasPendingEgyptSummonSpecial(e.team,e.id)&&(lowHealth||cycleDue)",
              'function spawnEgyptMageWarriors(e,p)',
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit('Missing: ' + repr(missing))
          for forbidden in ['WAR ADAPTIVE VISUAL LOD 2026-09-12','entity-lod-poster','WAR_LOD_POSTER_CACHE']:
              if forbidden in text:
                  raise SystemExit('Reverted optimization found: ' + forbidden)
          print('Egypt summon guard validation passed.')
          PY

      - name: Publish
        run: |
          if git diff --quiet -- index.html; then
            echo 'Guard already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Prevent stacked Egypt mage summons'
          git push origin main
