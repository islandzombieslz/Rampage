name: One-time PvP guest smoothness final4
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-pvp-guest-smoothness-final4.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply validated PvP guest networking patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, textwrap

          source=Path(".github/workflows/one-time-pvp-guest-smoothness-final3.yml").read_text(encoding="utf-8")
          match=re.search(r"python3 - <<'PY'\n(.*?)\n          PY",source,re.S)
          if not match:
              raise SystemExit("Could not extract validated final3 patch")
          code=textwrap.dedent(match.group(1))
          exec(compile(code,"pvp-final3-patch","exec"),{})

          p=Path("tests/pvp-smoke.cjs")
          t=p.read_text(encoding="utf-8")
          old='assert(html.includes("const PVP_INPUT_KEEPALIVE_MS=150")&&html.includes("signature===NetworkAdapter.lastInputSignature"),'
          new='assert(html.includes("const PVP_INPUT_KEEPALIVE_MS=120")&&html.includes("signature===NetworkAdapter.lastInputSignature"),'
          if t.count(old)!=1:
              raise SystemExit(f"keepalive assertion anchor count: {t.count(old)}")
          t=t.replace(old,new,1)
          p.write_text(t,encoding="utf-8")
          PY
      - name: Run focused regression tests
        run: |
          node tests/pvp-smoke.cjs
          node tests/progression-smoke.cjs
      - name: Commit final changes and remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/one-time-pvp-guest-smoothness.yml
          rm -f .github/workflows/one-time-pvp-guest-smoothness-retry.yml
          rm -f .github/workflows/one-time-pvp-guest-smoothness-final.yml
          rm -f .github/workflows/one-time-pvp-guest-smoothness-final2.yml
          rm -f .github/workflows/one-time-pvp-guest-smoothness-final3.yml
          rm -f .github/workflows/one-time-pvp-guest-smoothness-final4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/pvp-smoke.cjs .github/workflows/
          git commit -m "Smooth non-host PvP networking"
          git push origin HEAD:main
