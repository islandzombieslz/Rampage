name: Add Layered Game SFX

on:
  push:
    branches: [main]
    paths:
      - '.github/add_layered_sfx.py'
      - '.github/workflows/add-layered-sfx.yml'
      - 'assets/audio/sfx/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rampage-layered-sfx
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh branch
        run: git pull --rebase origin main

      - name: Verify seven SFX assets
        run: |
          set -euo pipefail
          for f in click.mp3 click2.mp3 transition.mp3 melee.mp3 shake.mp3 burn.mp3 mage.mp3; do
            test -s "assets/audio/sfx/$f"
          done
          python - <<'PY'
          from pathlib import Path
          for p in Path('assets/audio/sfx').glob('*.mp3'):
              b=p.read_bytes()
              if len(b)<500:
                  raise SystemExit(f'SFX too small: {p}')
              if not (b.startswith(b'ID3') or b[:2] in (b'\xff\xfb',b'\xff\xf3',b'\xff\xf2')):
                  raise SystemExit(f'Invalid MP3 header: {p}')
          print('Seven local SFX assets validated.')
          PY

      - name: Apply layered SFX
        run: python .github/add_layered_sfx.py

      - name: Refresh persistent asset cache
        run: python .github/update_asset_cache.py

      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S)
          if not blocks: raise SystemExit('No inline script found')
          Path('/tmp/rampage-main.js').write_text(blocks[-1],encoding='utf-8')
          PY
          node --check /tmp/rampage-main.js
          node --check sw.js

      - name: Validate SFX integration
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          assets=[
            'assets/audio/sfx/click.mp3','assets/audio/sfx/click2.mp3',
            'assets/audio/sfx/transition.mp3','assets/audio/sfx/melee.mp3',
            'assets/audio/sfx/shake.mp3','assets/audio/sfx/burn.mp3',
            'assets/audio/sfx/mage.mp3'
          ]
          required=[
            'LAYERED SFX 2026-09-18',
            "playLayeredSfx('transition',.75,0,260);",
            "current!=='menuScreen'",
            "button.classList.contains('plus')||button.classList.contains('minus')||button.id==='shopButton'",
            'MELEE_FIGHT_SFX_TYPES',
            'meleeFightSfxAttacking',
            "setLayeredLoop('melee'",
            "setLayeredLoop('burn'",
            'shakeSerial:Number(e.shakeSerial)||0',
            "playWorldLayeredSfx('shake'",
            "playWorldLayeredSfx('mage'",
            'updateLayeredBattleSfx(now);'
          ]
          missing=[x for x in required+assets if x not in t]
          if missing: raise SystemExit('Missing SFX integration: '+repr(missing))
          missing_sw=[a for a in assets if a not in sw]
          if missing_sw: raise SystemExit('SFX missing from service worker: '+repr(missing_sw))
          print('Layered SFX validation passed.')
          PY
          git diff --check

      - name: Publish
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          if git diff --cached --quiet; then
            echo 'SFX integration already current.'
            exit 0
          fi
          git commit -m 'Enable layered menu and War sound effects'
          git push origin main
