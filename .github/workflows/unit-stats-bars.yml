name: Unit stats and compact bars

on:
  push:
    paths:
      - '.github/patch_unit_stats_bars.py'
      - '.github/workflows/unit-stats-bars.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply unit stat and bar tuning
        run: python .github/patch_unit_stats_bars.py

      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          t=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',t,re.S)
          assert scripts, 'No inline script found'
          Path('/tmp/rampage-main.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/rampage-main.js

      - name: Validate requested tuning and preserved systems
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('index.html').read_text(encoding='utf-8')
          required=[
            'UNIT STATS/BARS TUNING 2026-09-09',
            'position:absolute;left:15px;top:-3px;width:48px;height:12px;',
            '.hp-bg,.shield-bg{position:absolute;left:0;width:48px',
            '.entity-visual.king-visual .entity-bars{left:36px;top:-4px;width:66px}',
            '.entity-visual.king-visual .shield-bg{width:66px}',
            'const WAR_UNIT_COSTS=Object.freeze({warrior:50,king:400,golem:550,mage:550,dragon:450});',
            'aria-label="Comprar Rei Guerreiro por 400 gemas"',
            'title="Rei Guerreiro — 400 gemas"',
            "function spawnKing(x,y,team,color){",
            'e.hp=e.maxHp=280;',
            'e.shield=e.maxShield=280;',
            'e.damage=35;',
            "function spawnWarrior(x,y,team,color,controlled=false,variant='male',ownerId=null){",
            'e.hp=e.maxHp=150;',
            'e.shield=e.maxShield=100;',
            "const ROOM_CODES=['REI','PLEBEU','CONDE'];",
            "if(b.dataset.target==='gems') state.gems=clamp(state.gems+dir*100,300,3000);",
            'p.gems=Math.max(0,state.gems+(p.bonusGems||0));',
            'WAR CAMERA COMPOSITOR 2026-09-09',
            "const WAR_ARENA_INSET={left:270,right:270,top:275,bottom:245};",
            'GIF SWITCH STABILITY 2026-09-08',
            'WAR FPS SWEEP 2026-09-09',
            'FIREBASE RTDB, HOST AUTORITATIVO',
          ]
          missing=[m for m in required if m not in t]
          assert not missing, 'Missing markers: '+repr(missing)
          forbidden=[
            'position:absolute;left:11px;top:-7px;width:56px;height:12px;',
            '.entity-visual.king-visual .entity-bars{left:31px;top:-8px;width:76px}',
            'const WAR_UNIT_COSTS=Object.freeze({warrior:50,king:300,golem:550,mage:550,dragon:450});',
            'aria-label="Comprar Rei Guerreiro por 300 gemas"',
            'title="Rei Guerreiro — 300 gemas"',
          ]
          present=[m for m in forbidden if m in t]
          assert not present, 'Old tuning remains: '+repr(present)
          assert t.count('https://i.postimg.cc/')==2, 'Arena external asset count changed'
          print('Unit stats/bars validation passed.')
          PY

      - name: Publish requested tuning
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No generated index changes needed.'
            exit 0
          fi
          git commit -m 'Tune king warrior stats and compact bars'
          git push
