name: Aplicar loja em sprites e novo wallpaper

on:
  push:
    paths:
      - '.github/workflows/apply-sprite-shop-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar novos sprites locais
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/ui/war-shop
          curl -fL --retry 3 'https://i.postimg.cc/V6SVxfsC/botao-loja.png' -o assets/ui/botao-loja.png
          curl -fL --retry 3 'https://i.postimg.cc/j5GFKpCw/card-magos-guerreiros.png' -o assets/ui/war-shop/card-magos-guerreiros.png
          curl -fL --retry 3 'https://i.postimg.cc/XJZzRjNf/card-golem-guerreiro.png' -o assets/ui/war-shop/card-golem-guerreiro.png
          curl -fL --retry 3 'https://i.postimg.cc/FRfBMrFj/card-dragao-guerreiro.png' -o assets/ui/war-shop/card-dragao-guerreiro.png
          curl -fL --retry 3 'https://i.postimg.cc/RF3DkSCw/card-guerreiros.png' -o assets/ui/war-shop/card-guerreiros.png
          curl -fL --retry 3 'https://i.postimg.cc/637mkW6B/walpaper-menus.png' -o assets/ui/walpaper-menus.png

      - name: Validar imagens baixadas
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            assets/ui/botao-loja.png \
            assets/ui/war-shop/card-magos-guerreiros.png \
            assets/ui/war-shop/card-golem-guerreiro.png \
            assets/ui/war-shop/card-dragao-guerreiro.png \
            assets/ui/war-shop/card-guerreiros.png \
            assets/ui/walpaper-menus.png; do
            test -s "$f"
            file "$f" | grep -q 'PNG image data'
          done

      - name: Aplicar alteracoes no HTML
        shell: bash
        run: |
          set -euo pipefail
          python .github/patch_shop_sprite_ui.py

      - name: Extrair e validar JavaScript principal
        shell: python
        run: |
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,flags=re.S)
          if not scripts:
              raise SystemExit('nenhum script encontrado')
          Path('/tmp/rampage-main.js').write_text(max(scripts,key=len),encoding='utf-8')

      - name: Validar interface e regras preservadas
        shell: bash
        run: |
          set -euo pipefail
          node --check /tmp/rampage-main.js
          grep -Fq 'assets/ui/botao-loja.png' index.html
          grep -Fq 'class="shop-sprite-grid"' index.html
          grep -Fq 'grid-template-columns:repeat(2,minmax(0,1fr))' index.html
          grep -Fq 'backdrop-filter:blur(2.2px) brightness(.72)' index.html
          grep -Fq 'assets/ui/walpaper-menus.png' index.html
          grep -Fq "$('#buyWarrior').onclick=()=>requestWarPurchase('buy-warrior');" index.html
          grep -Fq "$('#buyGolem').onclick=()=>requestWarPurchase('buy-golem');" index.html
          grep -Fq "$('#buyMage').onclick=()=>requestWarPurchase('buy-mage');" index.html
          grep -Fq "$('#buyDragon').onclick=()=>requestWarPurchase('buy-dragon');" index.html
          grep -q 'REMOTE WAR ROUND TRANSITION SYNC' index.html
          ! grep -q 'i.postimg.cc' index.html
          ! grep -q 'assets/ui/background-menu.png' index.html

      - name: Publicar alteracoes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/ui/botao-loja.png assets/ui/walpaper-menus.png assets/ui/war-shop
          git commit -m 'Replace war shop with sprite UI and update menu wallpaper'
          git push
