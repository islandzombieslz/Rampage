name: War performance phases 1-3

on:
  push:
    branches:
      - perf-phase-1-3-20260908
    paths:
      - '.github/patch_war_performance_phase123.py'
      - '.github/workflows/war-performance-phase123.yml'

permissions:
  contents: write

jobs:
  optimize-war:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply phases 1-3
        run: python .github/patch_war_performance_phase123.py

      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          t=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',t,re.S)
          assert scripts, 'No script block found'
          Path('/tmp/rampage-main.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/rampage-main.js

      - name: Verify rules, architecture and phase-4 exclusion
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, subprocess
          from pathlib import Path

          before=subprocess.check_output(['git','show','HEAD:index.html'],text=True)
          after=Path('index.html').read_text(encoding='utf-8')

          def section(t,start,end):
              a=t.index(start); b=t.index(end,a)
              return t[a:b]

          assert section(before,'const ASSETS = {','const state = {') == section(after,'const ASSETS = {','const state = {')
          assert section(before,'const speedMap=','const gifRuntime=new Map();') == section(after,'const speedMap=','const gifRuntime=new Map();')

          fb_before=re.search(r'const firebaseConfig=\{.*?\};',before,re.S).group(0)
          fb_after=re.search(r'const firebaseConfig=\{.*?\};',after,re.S).group(0)
          assert fb_before == fb_after
          assert 'FIREBASE RTDB, HOST AUTORITATIVO' in after
          assert 'now-NetworkAdapter.lastStateAt>=100' in after

          for marker in [
              'e.hp=e.maxHp=200;',
              'e.shield=e.maxShield=200;',
              'e.damage=25;',
              'kingNormalCount)||0)>=6',
              'const MAGE_SPECIAL_DAMAGE=100;',
              'const KING_SPECIAL_DAMAGE=50;',
              'const DRAGON_FIREBALL_DAMAGE=35;',
              'const DRAGON_BURN_DAMAGE=5;'
          ]:
              assert marker in after, marker

          for marker in [
              'WAR_AI_DECISION_INTERVAL_MS=70',
              'forEachWarSpatialCandidate',
              'warBurningEntities',
              'deadTargetIds',
              'serializeWarEntityForNetwork',
              'round-heal-alt',
              'heal-pulse-alt'
          ]:
              assert marker in after, marker

          rs=after.index("if((el._lastRegenSerial||0)!==(e.regenSerial||0))")
          re_=after.index("if(e.type==='golem')",rs)
          assert 'offsetWidth' not in after[rs:re_]
          assert '.webp' not in section(after,'const ASSETS = {','const state = {')
          PY
          test -z "$(git diff --name-only -- assets/)"

      - name: Publish reviewed optimization on branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index changes needed.'
            exit 0
          fi
          git commit -m 'Optimize war mode performance phases 1-3'
          git push
