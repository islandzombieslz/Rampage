name: Alpha Boot Intro

on:
  push:
    branches: [main]
    paths:
      - '.github/add_boot_intro.py'
      - '.github/workflows/add-boot-intro.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rampage-alpha-boot-intro
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh branch
        run: git pull --rebase origin main

      - name: Apply intro and menu transition rules
        run: python .github/add_boot_intro.py

      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S)
          if not blocks: raise SystemExit('No inline script found')
          Path('/tmp/rampage-main.js').write_text(blocks[-1],encoding='utf-8')
          PY
          node --check /tmp/rampage-main.js

      - name: Validate intro
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('index.html').read_text(encoding='utf-8')
          required=[
            '<div id="bootIntro" aria-hidden="true"></div>',
            "BOOT_INTRO_VIDEO_ID='j84JmKNz_5Q'",
            'youtube-nocookie.com/embed/',
            'autoplay=1&mute=0&controls=0&disablekb=1',
            "frame.setAttribute('allow','autoplay; encrypted-media')",
            "bootIntroCommand(frame,'unMute')",
            "bootIntroCommand(frame,'setVolume',[100])",
            'await bootIntroDone;',
            'startBootIntro();',
            '#bootIntro{',
            'position:fixed;',
            'width:100vw;',
            'height:100vh;',
            'function syncBootIntroLandscape(){',
            'const viewW=portrait?rawH:rawW;',
            'const coverW=Math.max(viewW,viewH*(16/9));',
            'bindBootIntroLandscape();',
            'syncBootIntroLandscape();',
            "current!=='menuScreen'",
            'screenWithFade(id,transitionSound)',
          ]
          missing=[x for x in required if x not in t]
          if missing:
              raise SystemExit('Intro validation missing: '+repr(missing))
          intro=t[t.index("/* ===== ALPHA YOUTUBE BOOT INTRO 2026-09-18 ===== */"):t.index('function bootReadSavedManifest')]
          forbidden=['window.visualViewport','applyLandscapeFallback()','try{resize()}']
          bad=[x for x in forbidden if x in intro]
          if bad:
              raise SystemExit('Intro must stay isolated from game viewport: '+repr(bad))
          print('Alpha boot intro validation passed.')
          PY
          git diff --check

      - name: Publish
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Boot intro already current.'
            exit 0
          fi
          git commit -m 'Keep Alpha intro horizontal'
          git push origin main
