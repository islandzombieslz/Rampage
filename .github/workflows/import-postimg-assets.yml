name: Importar assets do Postimg

on:
  push:
    paths:
      - '.github/workflows/import-postimg-assets.yml'

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar sprites, GIFs e menus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/ui assets/warrior assets/golem assets/mage

          get() {
            url="$1"
            dest="$2"
            echo "Baixando $dest"
            curl -L --fail --retry 4 --retry-delay 2 --connect-timeout 20 --max-time 180 "$url" -o "$dest"
            test -s "$dest"
          }

          get 'https://i.postimg.cc/Hk5PzbCC/background-menu.png' 'assets/ui/background-menu.png'
          get 'https://i.postimg.cc/fWFJBhzn/39fa9b22-f2cb-4ea6-ba64-27e2b0344f0b.png' 'assets/ui/criar-partida.png'
          get 'https://i.postimg.cc/c1jrXNsp/db136e35-44fb-4780-ab43-209414c09962.png' 'assets/ui/usar-codigo.png'
          get 'https://i.postimg.cc/DfjDw2gs/botao-PVP.png' 'assets/ui/botao-pvp.png'
          get 'https://i.postimg.cc/XNHhYV8p/botao-mestre-da-guerra.png' 'assets/ui/botao-mestre-da-guerra.png'
          get 'https://i.postimg.cc/sxWsJvfB/pvp-menu.png' 'assets/ui/pvp-menu.png'
          get 'https://i.postimg.cc/ydt79FHM/mestre-da-guerra-menu.png' 'assets/ui/mestre-da-guerra-menu.png'
          get 'https://i.postimg.cc/sXYvV6SD/Chat-GPT-Image-5-de-set-de-2026-14-31-31.png' 'assets/ui/cla-guerreiros.png'

          get 'https://i.postimg.cc/7YtjGcbM/guerreiroparado-ezgif-com-crop.gif' 'assets/warrior/guerreiro-parado.gif'
          get 'https://i.postimg.cc/jd3Bw9CF/guerreiroandando-ezgif-com-crop.gif' 'assets/warrior/guerreiro-andando.gif'
          get 'https://i.postimg.cc/d0HKFgBj/guerreira-parada.gif' 'assets/warrior/guerreira-parada.gif'
          get 'https://i.postimg.cc/mr2G0TQD/guerreira-andando.gif' 'assets/warrior/guerreira-andando.gif'
          get 'https://i.postimg.cc/RV1Nv7FF/espada-guerreiro.png' 'assets/warrior/espada-guerreiro.png'

          get 'https://i.postimg.cc/HsfdKGx1/golem-guerreiro-parado.gif' 'assets/golem/golem-parado.gif'
          get 'https://i.postimg.cc/YqJMVcSX/golem-guerreiro-andando.gif' 'assets/golem/golem-andando.gif'
          get 'https://i.postimg.cc/P5YTn6LR/golem-guerreiro-ataque.gif' 'assets/golem/golem-ataque.gif'
          get 'https://i.postimg.cc/7Z0wrBGk/golem-guerreiro-especial.gif' 'assets/golem/golem-especial.gif'
          get 'https://i.postimg.cc/Fs2NqtKC/pedras-golem-guerreiro.png' 'assets/golem/pedras-golem.png'

          get 'https://i.postimg.cc/kXySXpQL/mago-guerreiro-parado.gif' 'assets/mage/mago-parado.gif'
          get 'https://i.postimg.cc/jdTNTbfT/mago-guerreiro-andando.gif' 'assets/mage/mago-andando.gif'
          get 'https://i.postimg.cc/4xN9KQwS/mago-guerreiro-especial.gif' 'assets/mage/mago-especial.gif'
          get 'https://i.postimg.cc/zXNWNrg4/poder-mago-guerreiro.gif' 'assets/mage/poder-mago.gif'
          get 'https://i.postimg.cc/tgFppLPV/0904-ezgif-com-remove-background.gif' 'assets/mage/poder-mago-especial.gif'
          get 'https://i.postimg.cc/kMK8L4Bc/mao-com-cajado-guerreiro1.gif' 'assets/mage/mao-cajado.gif'
          get 'https://i.postimg.cc/44Vtjdmw/mao-magos.png' 'assets/mage/mao-magos.png'
          get 'https://i.postimg.cc/jjyttGNH/maga-guerreira-parada.gif' 'assets/mage/maga-parada.gif'
          get 'https://i.postimg.cc/4xDXCJKK/maga-guerreira-andando.gif' 'assets/mage/maga-andando.gif'
          get 'https://i.postimg.cc/wM4dwHKP/maga-guerreira-especial.gif' 'assets/mage/maga-especial.gif'

      - name: Trocar URLs externas por caminhos locais
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'https://i.postimg.cc/Hk5PzbCC/background-menu.png': 'assets/ui/background-menu.png',
              'https://i.postimg.cc/fWFJBhzn/39fa9b22-f2cb-4ea6-ba64-27e2b0344f0b.png': 'assets/ui/criar-partida.png',
              'https://i.postimg.cc/c1jrXNsp/db136e35-44fb-4780-ab43-209414c09962.png': 'assets/ui/usar-codigo.png',
              'https://i.postimg.cc/DfjDw2gs/botao-PVP.png': 'assets/ui/botao-pvp.png',
              'https://i.postimg.cc/XNHhYV8p/botao-mestre-da-guerra.png': 'assets/ui/botao-mestre-da-guerra.png',
              'https://i.postimg.cc/sxWsJvfB/pvp-menu.png': 'assets/ui/pvp-menu.png',
              'https://i.postimg.cc/ydt79FHM/mestre-da-guerra-menu.png': 'assets/ui/mestre-da-guerra-menu.png',
              'https://i.postimg.cc/sXYvV6SD/Chat-GPT-Image-5-de-set-de-2026-14-31-31.png': 'assets/ui/cla-guerreiros.png',
              'https://i.postimg.cc/7YtjGcbM/guerreiroparado-ezgif-com-crop.gif': 'assets/warrior/guerreiro-parado.gif',
              'https://i.postimg.cc/jd3Bw9CF/guerreiroandando-ezgif-com-crop.gif': 'assets/warrior/guerreiro-andando.gif',
              'https://i.postimg.cc/d0HKFgBj/guerreira-parada.gif': 'assets/warrior/guerreira-parada.gif',
              'https://i.postimg.cc/mr2G0TQD/guerreira-andando.gif': 'assets/warrior/guerreira-andando.gif',
              'https://i.postimg.cc/RV1Nv7FF/espada-guerreiro.png': 'assets/warrior/espada-guerreiro.png',
              'https://i.postimg.cc/HsfdKGx1/golem-guerreiro-parado.gif': 'assets/golem/golem-parado.gif',
              'https://i.postimg.cc/YqJMVcSX/golem-guerreiro-andando.gif': 'assets/golem/golem-andando.gif',
              'https://i.postimg.cc/P5YTn6LR/golem-guerreiro-ataque.gif': 'assets/golem/golem-ataque.gif',
              'https://i.postimg.cc/7Z0wrBGk/golem-guerreiro-especial.gif': 'assets/golem/golem-especial.gif',
              'https://i.postimg.cc/Fs2NqtKC/pedras-golem-guerreiro.png': 'assets/golem/pedras-golem.png',
              'https://i.postimg.cc/kXySXpQL/mago-guerreiro-parado.gif': 'assets/mage/mago-parado.gif',
              'https://i.postimg.cc/jdTNTbfT/mago-guerreiro-andando.gif': 'assets/mage/mago-andando.gif',
              'https://i.postimg.cc/4xN9KQwS/mago-guerreiro-especial.gif': 'assets/mage/mago-especial.gif',
              'https://i.postimg.cc/zXNWNrg4/poder-mago-guerreiro.gif': 'assets/mage/poder-mago.gif',
              'https://i.postimg.cc/tgFppLPV/0904-ezgif-com-remove-background.gif': 'assets/mage/poder-mago-especial.gif',
              'https://i.postimg.cc/kMK8L4Bc/mao-com-cajado-guerreiro1.gif': 'assets/mage/mao-cajado.gif',
              'https://i.postimg.cc/44Vtjdmw/mao-magos.png': 'assets/mage/mao-magos.png',
              'https://i.postimg.cc/jjyttGNH/maga-guerreira-parada.gif': 'assets/mage/maga-parada.gif',
              'https://i.postimg.cc/4xDXCJKK/maga-guerreira-andando.gif': 'assets/mage/maga-andando.gif',
              'https://i.postimg.cc/wM4dwHKP/maga-guerreira-especial.gif': 'assets/mage/maga-especial.gif',
          }

          missing = [url for url in replacements if url not in text]
          if missing:
              raise SystemExit('URLs esperadas não encontradas no index.html: ' + ', '.join(missing))

          for old, new in replacements.items():
              text = text.replace(old, new)

          text = text.replace(
              'Não foi possível carregar os GIFs do guerreiro. Verifique a Internet ou o acesso ao i.postimg.cc.',
              'Não foi possível carregar um ou mais assets locais do jogo.'
          )

          if 'i.postimg.cc' in text:
              raise SystemExit('Ainda existem referências ao Postimg no index.html')

          path.write_text(text, encoding='utf-8')

      - name: Validar e publicar no repositório
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -d assets
          count=$(find assets -type f | wc -l)
          echo "Assets locais: $count"
          test "$count" -eq 28
          ! grep -q 'i.postimg.cc' index.html

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets
          if git diff --cached --quiet; then
            echo 'Nada para publicar.'
            exit 0
          fi
          git commit -m 'Host game assets locally on GitHub'
          git push
