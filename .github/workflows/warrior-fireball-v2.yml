name: Corrigir alvo do Guerreiro e orientação da bola v2

on:
  push:
    paths:
      - '.github/workflows/warrior-fireball-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar correções
        shell: bash
        run: |
          set -euo pipefail
          python .github/patch_warrior_targeting_fireball_v2.py

      - name: Extrair JavaScript principal
        shell: python
        run: |
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,flags=re.S)
          if not scripts:
              raise SystemExit('nenhum script encontrado')
          Path('/tmp/rampage-main.js').write_text(max(scripts,key=len),encoding='utf-8')

      - name: Validar regras
        shell: bash
        run: |
          set -euo pipefail
          node --check /tmp/rampage-main.js
          grep -Fq "const nonDragonEnemies=allEnemies.filter(t=>t.type!=='dragon');" index.html
          grep -Fq "if(nonDragonEnemies.length){" index.html
          grep -Fq 'scaleY(-1)' index.html
          grep -Fq "const dragons=enemies.filter(t=>t.type==='dragon');" index.html
          grep -q 'REMOTE WAR ROUND TRANSITION SYNC' index.html
          test "$(find assets -type f | wc -l)" -eq 33

      - name: Publicar
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Make warrior targeting deterministic and flip fireball sprite'
          git push
