name: One-time diagonal special HUD polish
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-diagonal-special-hud.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply requested HUD polish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def swap(text, old, new, label):
              n=text.count(old)
              if n!=1:
                  raise SystemExit(f"{label}: expected 1 match, found {n}")
              return text.replace(old,new,1)

          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          s=swap(s,
          """#pvpCombatHud .pvp-special-wrap{position:relative;width:clamp(108px,14vw,136px);height:clamp(48px,7vw,64px);
           display:flex;align-items:flex-end;justify-content:flex-start;isolation:isolate}
          #pvpCombatHud .pvp-special-button{position:relative;width:clamp(82px,10.5vw,104px);height:clamp(48px,7vw,64px);min-height:0;margin:0;
           padding:0;overflow:hidden;border:2px solid #4b4030;border-radius:11px;background:#17191c;
           box-shadow:inset 0 1px 4px #000b,0 2px 6px #0007;transition:border-color .13s ease,box-shadow .13s ease,filter .13s ease}
          #pvpCombatHud .pvp-special-fill{position:absolute;left:0;top:0;bottom:0;width:var(--pvp-special-progress,0%);
           border-radius:8px 0 0 8px;
           background:repeating-linear-gradient(90deg,#963b1d 0 7px,#c95c20 7px 14px,#e89028 14px 21px,#f2b53b 21px 28px,#3b2418 28px 31px);
           box-shadow:inset -2px 0 4px #0007;transition:width .12s linear,filter .13s ease}""",
          """#pvpCombatHud .pvp-special-wrap{position:relative;width:clamp(98px,12.5vw,122px);height:clamp(46px,6.6vw,60px);
           display:flex;align-items:flex-end;justify-content:flex-start;isolation:isolate;cursor:pointer}
          #pvpCombatHud .pvp-special-button{position:relative;width:clamp(74px,9.4vw,92px);height:clamp(46px,6.6vw,60px);min-height:0;margin:0;
           padding:0;overflow:hidden;border:2px solid #4b4030;border-radius:11px;background:#17191c;
           box-shadow:inset 0 1px 4px #000b,0 2px 6px #0007;transition:border-color .13s ease,box-shadow .13s ease,filter .13s ease}
          #pvpCombatHud .pvp-special-fill{position:absolute;left:0;top:0;bottom:0;width:var(--pvp-special-progress,0%);
           border-radius:8px 0 0 8px;
           background:repeating-linear-gradient(110deg,#a9461d 0px,#a9461d 10px,#e58a27 10px,#e58a27 20px,#ffd34d 20px,#ffd34d 30px,#cf6b20 30px,#cf6b20 40px);
           box-shadow:inset -2px 0 4px #0007;transition:width .12s linear,filter .13s ease}""",
          "special rectangle and diagonal stripes")

          s=swap(s,
          """#pvpCombatHud .pvp-special-icon{position:absolute;right:-7px;bottom:-8px;width:clamp(64px,8.8vw,82px);height:clamp(64px,8.8vw,82px);
           object-fit:contain;z-index:4;pointer-events:none;user-select:none;filter:drop-shadow(0 3px 5px #000a);transition:transform .13s ease,filter .13s ease}""",
          """#pvpCombatHud .pvp-special-icon{position:absolute;right:-13px;bottom:-13px;width:clamp(82px,11vw,104px);height:clamp(82px,11vw,104px);
           object-fit:contain;z-index:4;pointer-events:none;user-select:none;filter:drop-shadow(0 3px 5px #000a);transition:transform .13s ease,filter .13s ease}""",
          "larger fist")

          s=swap(s,
          """$$('#pvpCombatHud [data-pvp-action]').forEach(button=>{
           if(button.dataset.pvpAction==='special'){
             // Primeiro contato: outro dedo pode continuar no joystick ou no botão de ataque.
             button.addEventListener('pointerdown',event=>pvpActivateHudAction(button,event));
             button.onclick=event=>{event.preventDefault();event.stopPropagation()};
           }else button.onclick=event=>pvpActivateHudAction(button,event);
          });""",
          """$$('#pvpCombatHud [data-pvp-action]').forEach(button=>{
           if(button.dataset.pvpAction==='special'){
             button.onclick=event=>{event.preventDefault();event.stopPropagation()};
           }else button.onclick=event=>pvpActivateHudAction(button,event);
          });
          const pvpSpecialWrap=$('#pvpCombatHud .pvp-special-wrap');
          const pvpSpecialButton=pvpSpecialWrap?.querySelector('[data-pvp-action="special"]');
          if(pvpSpecialWrap&&pvpSpecialButton){
           const activateWholeSpecialHud=event=>{
             if(state.mode!=='pvp'||!state.running||pvpSpecialButton.disabled)return;
             event.preventDefault();event.stopPropagation();
             pvpActivateHudAction(pvpSpecialButton,event);
           };
           pvpSpecialWrap.style.touchAction='none';
           pvpSpecialWrap.addEventListener('pointerdown',activateWholeSpecialHud);
           pvpSpecialWrap.onclick=event=>{event.preventDefault();event.stopPropagation()};
          }""",
          "whole special HUD input")

          p.write_text(s,encoding="utf-8")

          p=Path("tests/pvp-smoke.cjs")
          s=p.read_text(encoding="utf-8")
          s=swap(s,
          """assert(html.includes("#pvpCombatHud .pvp-special-button{position:relative;width:clamp(82px,10.5vw,104px);height:clamp(48px,7vw,64px)"),
           'special control keeps the current height but uses a rectangular HUD');
          assert(html.includes('repeating-linear-gradient(90deg')&&html.includes('.pvp-special-wrap.ready .pvp-special-button'),
           'special HUD uses striped progress and lights up the whole control when ready');
          assert(html.includes("width:clamp(64px,8.8vw,82px);height:clamp(64px,8.8vw,82px)"),
           'Warrior special fist icon is deliberately larger');
          assert(html.includes("button.addEventListener('pointerdown',event=>pvpActivateHudAction(button,event))"),
           'special fires on pointerdown so multitouch does not wait for click release');""",
          """assert(html.includes("#pvpCombatHud .pvp-special-button{position:relative;width:clamp(74px,9.4vw,92px);height:clamp(46px,6.6vw,60px)"),
           'special control remains rectangular but is slightly smaller');
          assert(html.includes('repeating-linear-gradient(110deg')&&html.includes('.pvp-special-wrap.ready .pvp-special-button'),
           'special HUD uses diagonal XP-style stripes and lights up the whole control when ready');
          assert(html.includes("width:clamp(82px,11vw,104px);height:clamp(82px,11vw,104px)"),
           'Warrior special fist icon is significantly larger');
          assert(html.includes("pvpSpecialWrap.addEventListener('pointerdown',activateWholeSpecialHud)"),
           'the entire special HUD fires on pointerdown for click/touch multitouch support');""",
          "special HUD smoke assertions")
          p.write_text(s,encoding="utf-8")
          PY
      - name: Run regression tests
        run: |
          node tests/pvp-smoke.cjs
          node tests/progression-smoke.cjs
      - name: Commit changes and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-time-diagonal-special-hud.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/pvp-smoke.cjs .github/workflows/one-time-diagonal-special-hud.yml
          git commit -m "Polish special HUD stripes and hit area"
          git push origin HEAD:main
