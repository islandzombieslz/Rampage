name: One-time localize History artwork
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-localize-history-art.yml'
permissions:
  contents: write
jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download supplied History artwork
        run: |
          mkdir -p assets/ui
          curl -L --fail --retry 3 'https://i.postimg.cc/HnSCZB63/Botao-modo-historia.png' -o assets/ui/botao-history.png
          test -s assets/ui/botao-history.png
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('https://i.postimg.cc/HnSCZB63/Botao-modo-historia.png','assets/ui/botao-history.png')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Run History smoke test
        run: node tests/history-smoke.cjs
      - name: Commit artwork and remove workflow
        run: |
          rm -f .github/workflows/one-time-localize-history-art.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ui/botao-history.png index.html .github/workflows/one-time-localize-history-art.yml
          git commit -m "Store History mode artwork locally"
          git push origin HEAD:main
