name: Room color codes

on:
  push:
    branches:
      - room-color-codes-20260908
    paths:
      - '.github/patch_room_color_codes.py'
      - '.github/workflows/room-color-codes.yml'

permissions:
  contents: write

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply room-code patch
        run: python .github/patch_room_color_codes.py

      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          t=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',t,re.S)
          assert scripts, 'No script block found'
          Path('/tmp/rampage-main.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/rampage-main.js

      - name: Verify Firebase and gameplay preserved
        run: |
          python - <<'PY'
          import re, subprocess
          from pathlib import Path
          before=subprocess.check_output(['git','show','HEAD:index.html'],text=True)
          after=Path('index.html').read_text(encoding='utf-8')

          fb_before=re.search(r'const firebaseConfig=\{.*?\};',before,re.S).group(0)
          fb_after=re.search(r'const firebaseConfig=\{.*?\};',after,re.S).group(0)
          assert fb_before == fb_after
          assert 'FIREBASE RTDB, HOST AUTORITATIVO' in after
          assert 'rooms/${code}' in after

          # Gameplay/unit balance must not change in this patch.
          markers=[
            'const WAR_TROOP_SPEED_MULTIPLIER=.50;',
            'const WAR_GOLEM_EXTRA_SPEED_MULTIPLIER=.87;',
            'const MAGE_SPECIAL_DAMAGE=100;',
            'const MAGE_SPECIAL_HEAL=30;',
            'const KING_SPECIAL_DAMAGE=50;',
            'const DRAGON_FIREBALL_DAMAGE=35;',
            'const DRAGON_BURN_DAMAGE=5;',
            'e.hp=e.maxHp=600;',
            'e.shield=e.maxShield=200;',
            'if(p.gems<75)return false;',
            'if(p.gems<250)return false;',
            'if(p.gems<350)return false;',
            'if(p.gems<550)return false;'
          ]
          for marker in markers: assert marker in after, marker

          # New room-code behavior.
          assert "const ROOM_COLOR_NAMES=[" in after
          assert "return ROOM_COLOR_NAMES[ai]+'-'+ROOM_COLOR_NAMES[bi];" in after
          assert 'maxlength="32"' in after
          assert 'placeholder="AZUL-CORAL"' in after
          assert 'code=normalizeRoomCode(code);' in after
          assert "normalizeRoomCode($('#roomCodeInput').value)" in after
          assert "for(let i=0;i<32;i++)" in after
          assert "if(/^[A-Z0-9]{6}$/.test(raw))return raw;" in after

          # New generated keys use only Firebase-safe uppercase letters and hyphen.
          m=re.search(r'const ROOM_COLOR_NAMES=\[(.*?)\];',after,re.S)
          names=re.findall(r"'([A-Z]+)'",m.group(1))
          assert len(names)>=40
          assert len(names)==len(set(names))
          assert all(re.fullmatch(r'[A-Z]+',n) for n in names)
          assert all('/' not in n and '.' not in n and '$' not in n and '#' not in n and '[' not in n and ']' not in n for n in names)
          PY

      - name: Commit validated change
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use color names for room codes'
          git push
