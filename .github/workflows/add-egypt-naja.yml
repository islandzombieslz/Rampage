name: Add Egypt Naja

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-egypt-naja.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rampage-add-egypt-naja
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh branch
        run: git pull --rebase origin main

      - name: Download Naja assets
        run: |
          set -euo pipefail
          mkdir -p assets/egypt/naja
          curl -L --fail --retry 3 --retry-delay 2 'https://i.postimg.cc/Z5KHcMvY/card-cobra-egito.png' -o assets/egypt/naja/card.png
          curl -L --fail --retry 3 --retry-delay 2 'https://i.postimg.cc/rwnJYN5F/parada-cobra-egito.gif' -o assets/egypt/naja/idle.gif
          curl -L --fail --retry 3 --retry-delay 2 'https://i.postimg.cc/28xTnD6L/andando-cobra-egito.gif' -o assets/egypt/naja/walk.gif
          curl -L --fail --retry 3 --retry-delay 2 'https://i.postimg.cc/8zP4H0fJ/especial-cobra-egito.gif' -o assets/egypt/naja/special-burrow.gif
          curl -L --fail --retry 3 --retry-delay 2 'https://i.postimg.cc/RZVdRDJ3/final-do-especial-cobra-egito.gif' -o assets/egypt/naja/special-emerge.gif
          curl -L --fail --retry 3 --retry-delay 2 'https://i.postimg.cc/6p5c0m4p/ataque-normal-cobra-egito.gif' -o assets/egypt/naja/attack-normal.gif
          for f in assets/egypt/naja/card.png assets/egypt/naja/idle.gif assets/egypt/naja/walk.gif assets/egypt/naja/special-burrow.gif assets/egypt/naja/special-emerge.gif assets/egypt/naja/attack-normal.gif; do test -s "$f"; done

      - name: Restore and apply Naja patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip
          payload=Path('.github/add_egypt_naja.py.gz.b64').read_text(encoding='utf-8')
          Path('/tmp/add_egypt_naja.py').write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          python -m py_compile /tmp/add_egypt_naja.py
          python /tmp/add_egypt_naja.py

      - name: Tune Naja balance and size
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')

          def replace_one_of(olds,new,label):
              global t
              if new in t:
                  return
              for old in olds:
                  count=t.count(old)
                  if count==1:
                      t=t.replace(old,new,1)
                      return
              raise SystemExit(f'{label}: no unique migration anchor found')

          replace_one_of(
              ['e.damage=40;\n e.r=36;','e.damage=45;\n e.r=36;'],
              'e.damage=60;\n e.r=36;',
              'Naja base damage'
          )
          replace_one_of(
              ['applyCombatHit(target,e,40,{knockForce:220,knockTime:.12,tilt:9});','applyCombatHit(target,e,45,{knockForce:220,knockTime:.12,tilt:9});'],
              'applyCombatHit(target,e,60,{knockForce:220,knockTime:.12,tilt:9});',
              'Naja normal hit damage'
          )
          replace_one_of(
              ['const NAJA_SPECIAL_DAMAGE=75;','const NAJA_SPECIAL_DAMAGE=85;'],
              'const NAJA_SPECIAL_DAMAGE=80;',
              'Naja special damage'
          )
          replace_one_of(
              ["e.type==='golem'?1.34:e.type==='naja'?1.18:","e.type==='golem'?1.34:e.type==='naja'?1.45:"],
              "e.type==='golem'?1.34:e.type==='naja'?1.75:",
              'Naja visual scale'
          )
          replace_one_of(
              ['''     knockForce:1260,\n     knockTime:.56,\n     tilt:36,\n     shake:24,\n     shakeDuration:.62,'''],
              '''     knockForce:620,\n     knockTime:.42,\n     tilt:24,\n     shake:18,\n     shakeDuration:.46,''',
              'Naja special knockback'
          )
          replace_one_of(
              ["if(target.type==='dragon'&&target.dragonFlightState==='flying'&&(attacker.type==='warrior'||attacker.type==='brownWarrior'||attacker.type==='king'||attacker.type==='naja'))return false;"],
              "if(target.type==='dragon'&&target.dragonFlightState==='flying'&&(attacker.type==='warrior'||attacker.type==='brownWarrior'||attacker.type==='king'))return false;",
              'Naja can engage flying dragon'
          )

          old_speed=""" // Exatamente a mesma velocidade do Golem Guerreiro.\n e.speed=state.mode==='war'?92*WAR_TROOP_SPEED_MULTIPLIER*WAR_GOLEM_EXTRA_SPEED_MULTIPLIER:92;"""
          new_speed=""" // Um pouco mais rápida que o Golem Guerreiro, sem perder o peso da unidade.\n e.speed=state.mode==='war'?100*WAR_TROOP_SPEED_MULTIPLIER*WAR_GOLEM_EXTRA_SPEED_MULTIPLIER:100;"""
          replace_one_of([old_speed],new_speed,'Naja movement speed')

          naja_decl="const najaStableHit=target.type==='naja' && !najaSpecialPhase(target) && (attacker.type==='warrior' || attacker.type==='brownWarrior' || attacker.type==='king' || attacker.type==='mage');"
          if naja_decl not in t:
              anchor="const brownStableHit=target.type==='brownWarrior' && (attacker.type==='warrior' || attacker.type==='brownWarrior' || attacker.type==='king' || attacker.type==='mage');"
              if t.count(anchor)!=1:
                  raise SystemExit('Naja knockback resistance declaration anchor missing')
              t=t.replace(anchor,anchor+'\n '+naja_decl,1)

          naja_block=""" // Naja: resistência leve a golpes comuns. Um impacto empurra, o seguinte é ignorado.\n // Quando o empurrão entra, ele também é mais fraco e curto que o normal.\n if(najaStableHit){\n   const cycle=Number(target.najaKnockCycle)||0;\n   applyKnockback=(cycle===0);\n   target.najaKnockCycle=(cycle+1)%2;\n   knockForce*=0.45;\n   knockTime=Math.min(knockTime,0.15);\n }\n"""
          if naja_block not in t:
              anchor=' // Durante qualquer especial ativo, o alvo recebe só 50% da força de empurrão.'
              if t.count(anchor)!=1:
                  raise SystemExit('Naja knockback resistance block anchor missing')
              t=t.replace(anchor,naja_block+anchor,1)

          old_move="if(!golemVsWarriorMage&&!brownStableHit)target.moving=false;"
          new_move="if(!golemVsWarriorMage&&!brownStableHit&&!najaStableHit)target.moving=false;"
          replace_one_of([old_move],new_move,'Naja knockback movement stability')

          # Invulnerabilidade cobre todo o especial: entrada, subterrâneo e GIF de saída.
          old_invuln="""function najaIsInvulnerable(e,now=performance.now()){
 const phase=najaSpecialPhase(e,now);
 return phase==='burrowing'||phase==='underground';
}"""
          new_invuln="""function najaIsInvulnerable(e,now=performance.now()){
 const phase=najaSpecialPhase(e,now);
 return phase!==null;
}"""
          replace_one_of([old_invuln],new_invuln,'Naja full special invulnerability')

          # Desloca somente o corpo/sprite um pouco para a direita e para baixo.
          old_body=""".entity-visual.naja-visual .entity-body{
  left:-8px;
  top:-8px;
  width:126px;
  height:132px;
  object-fit:contain;
}"""
          new_body=""".entity-visual.naja-visual .entity-body{
  left:-2px;
  top:-2px;
  width:126px;
  height:132px;
  object-fit:contain;
}"""
          replace_one_of([old_body],new_body,'Naja visual offset')

          # Estado único do especial acionado quando o escudo zera.
          old_spawn=""" e.najaAttackSerial=0;
 e.najaNormalCount=0;
 e.najaPhase='seek';
 e.pendingNajaAttack=null;"""
          new_spawn=""" e.najaAttackSerial=0;
 e.najaNormalCount=0;
 e.najaShieldSpecialUsed=false;
 e.najaShieldSpecialPending=false;
 e.najaPhase='seek';
 e.pendingNajaAttack=null;"""
          replace_one_of([old_spawn],new_spawn,'Naja shield special initial state')

          old_snapshot="""   out.najaAttackSerial=Number(e.najaAttackSerial)||0;
   out.najaNormalCount=Number(e.najaNormalCount)||0;
   out.najaPhase=e.najaPhase||'seek';"""
          new_snapshot="""   out.najaAttackSerial=Number(e.najaAttackSerial)||0;
   out.najaNormalCount=Number(e.najaNormalCount)||0;
   out.najaShieldSpecialUsed=!!e.najaShieldSpecialUsed;
   out.najaShieldSpecialPending=!!e.najaShieldSpecialPending;
   out.najaPhase=e.najaPhase||'seek';"""
          replace_one_of([old_snapshot],new_snapshot,'Naja shield special network state')

          old_before="const beforeDurability=Math.max(0,Number(target.shield)||0)+Math.max(0,Number(target.hp)||0);"
          new_before="""const beforeShield=Math.max(0,Number(target.shield)||0);
 const beforeDurability=beforeShield+Math.max(0,Number(target.hp)||0);"""
          replace_one_of([old_before],new_before,'Naja shield break detection baseline')

          old_damage_tail=""" if(remaining>0)target.hp-=remaining;
 const afterDurability=Math.max(0,Number(target.shield)||0)+Math.max(0,Number(target.hp)||0);"""
          new_damage_tail=""" if(remaining>0)target.hp-=remaining;
 // O primeiro rompimento do escudo da Naja arma exatamente um especial extra.
 if(target.type==='naja'&&!target.najaShieldSpecialUsed&&beforeShield>0&&target.shield<=0){
   target.najaShieldSpecialUsed=true;
   target.najaShieldSpecialPending=true;
   target.attackCooldown=0;
 }
 const afterDurability=Math.max(0,Number(target.shield)||0)+Math.max(0,Number(target.hp)||0);"""
          replace_one_of([old_damage_tail],new_damage_tail,'Naja shield break special trigger')

          old_special_start=""" }else{
   // Cancela qualquer empurrão que já estivesse em andamento no instante em que cava.
   e.knockTime=0;e.knockVX=0;e.knockVY=0;"""
          new_special_start=""" }else{
   // Consome o gatilho do escudo ao iniciar qualquer especial; o marcador 'used' impede repetição.
   e.najaShieldSpecialPending=false;
   // Cancela qualquer empurrão que já estivesse em andamento no instante em que cava.
   e.knockTime=0;e.knockVX=0;e.knockVY=0;"""
          replace_one_of([old_special_start],new_special_start,'Naja shield special consumption')

          old_ai=""" // 4 ataques normais completos; o 5º ataque é o especial de escavação.
 if((Number(e.najaNormalCount)||0)>=4){"""
          new_ai=""" // Escudo zerado prioriza um especial único; depois segue o ciclo normal de 4 ataques + especial.
 const najaNeedsSpecial=!!e.najaShieldSpecialPending||(Number(e.najaNormalCount)||0)>=4;
 if(najaNeedsSpecial){"""
          replace_one_of([old_ai],new_ai,'Naja shield special AI priority')

          p.write_text(t,encoding='utf-8')
          print('Naja tuning applied.')
          PY

      - name: Refresh persistent asset cache
        run: python .github/update_asset_cache.py

      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script>(.*?)</script>',html,re.S)
          if not blocks:
              raise SystemExit('No classic script block found')
          Path('/tmp/rampage-main.js').write_text(blocks[-1],encoding='utf-8')
          PY
          node --check /tmp/rampage-main.js

      - name: Validate Naja integration
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('index.html').read_text(encoding='utf-8')
          required=[
            '/* EGYPT NAJA SYSTEM 2026-09-17 */','id="buyEgyptNaja"','naja:550',
            'function spawnNaja(','function aiFightNaja(','function chooseNajaEmergenceTarget(',
            'function resolveNajaEmergence(','NAJA_UNDERGROUND_MS=5000','NAJA_SPECIAL_DAMAGE=80',
            'e.hp=e.maxHp=600','e.shield=e.maxShield=200','e.damage=60','NAJA_ATTACK_INTERVAL_SEC=2',
            'applyCombatHit(target,e,60,{knockForce:220,knockTime:.12,tilt:9});',
            "e.type==='golem'?1.34:e.type==='naja'?1.75:",
            "e.speed=state.mode==='war'?100*WAR_TROOP_SPEED_MULTIPLIER*WAR_GOLEM_EXTRA_SPEED_MULTIPLIER:100;",
            "if(target.type==='dragon'&&target.dragonFlightState==='flying'&&(attacker.type==='warrior'||attacker.type==='brownWarrior'||attacker.type==='king'))return false;",
            'knockForce:620','knockTime:.42','tilt:24','shake:18','shakeDuration:.46',
            "const najaStableHit=target.type==='naja' && !najaSpecialPhase(target)",
            'target.najaKnockCycle=(cycle+1)%2','knockForce*=0.45','knockTime=Math.min(knockTime,0.15)',
            "if(!golemVsWarriorMage&&!brownStableHit&&!najaStableHit)target.moving=false;",
            "return phase!==null;",
            'left:-2px;','top:-2px;',
            'e.najaShieldSpecialUsed=false','e.najaShieldSpecialPending=false',
            'out.najaShieldSpecialUsed=!!e.najaShieldSpecialUsed','out.najaShieldSpecialPending=!!e.najaShieldSpecialPending',
            "target.type==='naja'&&!target.najaShieldSpecialUsed&&beforeShield>0&&target.shield<=0",
            'target.najaShieldSpecialUsed=true','target.najaShieldSpecialPending=true',
            'e.najaShieldSpecialPending=false',
            'const najaNeedsSpecial=!!e.najaShieldSpecialPending||(Number(e.najaNormalCount)||0)>=4;',
            "if(target.type==='naja'&&najaIsInvulnerable(target))return",
            "if(target.type==='naja'&&najaSpecialPhase(target))applyKnockback=false",
            'buy-egypt-naja','pendingNajaAttack','becameTeleported',
            'assets/egypt/naja/card.png','assets/egypt/naja/idle.gif','assets/egypt/naja/walk.gif',
            'assets/egypt/naja/attack-normal.gif','assets/egypt/naja/special-burrow.gif','assets/egypt/naja/special-emerge.gif'
          ]
          missing=[x for x in required if x not in t]
          if missing:
              raise SystemExit('Missing Naja integration/tuning: '+repr(missing))
          for f in ['card.png','idle.gif','walk.gif','attack-normal.gif','special-burrow.gif','special-emerge.gif']:
              path=Path('assets/egypt/naja')/f
              if not path.is_file() or path.stat().st_size<100:
                  raise SystemExit('Invalid Naja asset: '+str(path))
          sw=Path('sw.js').read_text(encoding='utf-8')
          if 'assets/egypt/naja/special-emerge.gif' not in sw:
              raise SystemExit('Naja assets missing from service-worker manifest')
          print('Naja integration and tuning validation passed')
          PY
          git diff --check

      - name: Publish
        run: |
          if git diff --quiet -- index.html sw.js assets/egypt/naja; then
            echo 'No game change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js assets/egypt/naja
          git commit -m 'Make Naja special invulnerable and trigger on shield break'
          git push origin main
