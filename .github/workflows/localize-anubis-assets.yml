name: Localize Egypt Anubis Assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/localize-anubis-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh branch
        run: git pull --rebase origin main

      - name: Download exact Anubis originals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/egypt/anubis

          download() {
            url="$1"
            out="$2"
            echo "Downloading $out"
            curl --http1.1 -fL               --retry 1 --retry-delay 1 --retry-all-errors               --connect-timeout 5 --max-time 20               -A "Mozilla/5.0 GitHub-Actions Rampage-Asset-Mirror"               "$url" -o "$out"
          }

          download 'https://i.postimg.cc/MHQbVVvH/card-anubbis-do-egito.png' 'assets/egypt/anubis/card.png' &
          p1=$!
          download 'https://i.postimg.cc/3R6FknJw/annubis-andando.gif' 'assets/egypt/anubis/walk.gif' &
          p2=$!
          download 'https://i.postimg.cc/1tTr8J5R/annubis-parado.gif' 'assets/egypt/anubis/idle.gif' &
          p3=$!
          download 'https://i.postimg.cc/L51BLLn2/ataque-normal-annubis.gif' 'assets/egypt/anubis/attack-melee.gif' &
          p4=$!
          download 'https://i.postimg.cc/XJXgNTWf/ataque-a-distancia-annubis.gif' 'assets/egypt/anubis/attack-ranged.gif' &
          p5=$!
          download 'https://i.postimg.cc/gJ5HxNkm/power-annubis.gif' 'assets/egypt/anubis/projectile.gif' &
          p6=$!

          wait "$p1" "$p2" "$p3" "$p4" "$p5" "$p6"

      - name: Verify downloaded animated media
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          card=Path('assets/egypt/anubis/card.png')
          if card.read_bytes()[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('Anubis card is not a PNG')
          if card.stat().st_size < 100_000:
              raise SystemExit('Anubis card download is unexpectedly small')

          gifs=[
              Path('assets/egypt/anubis/walk.gif'),
              Path('assets/egypt/anubis/idle.gif'),
              Path('assets/egypt/anubis/attack-melee.gif'),
              Path('assets/egypt/anubis/attack-ranged.gif'),
              Path('assets/egypt/anubis/projectile.gif'),
          ]
          for p in gifs:
              data=p.read_bytes()
              if data[:6] not in (b'GIF87a',b'GIF89a'):
                  raise SystemExit(f'{p} is not a real GIF')
              # The chat upload pipeline flattened the user attachments to PNG
              # previews, so preserve the actual animated media from the original
              # URLs and mirror those bytes into the repository.
              if p.stat().st_size < 300_000:
                  raise SystemExit(f'{p} is unexpectedly small for the animated original')
              print(p, p.stat().st_size, data[:6].decode('ascii'))
          print('Animated Anubis originals validated before repository mirror.')
          PY

      - name: Replace Postimg with repository assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          mapping={
            'https://i.postimg.cc/MHQbVVvH/card-anubbis-do-egito.png':'assets/egypt/anubis/card.png',
            'https://i.postimg.cc/3R6FknJw/annubis-andando.gif':'assets/egypt/anubis/walk.gif',
            'https://i.postimg.cc/1tTr8J5R/annubis-parado.gif':'assets/egypt/anubis/idle.gif',
            'https://i.postimg.cc/L51BLLn2/ataque-normal-annubis.gif':'assets/egypt/anubis/attack-melee.gif',
            'https://i.postimg.cc/XJXgNTWf/ataque-a-distancia-annubis.gif':'assets/egypt/anubis/attack-ranged.gif',
            'https://i.postimg.cc/gJ5HxNkm/power-annubis.gif':'assets/egypt/anubis/projectile.gif',
          }
          missing=[old for old in mapping if old not in t]
          if missing:
              # Idempotent reruns are OK if every local path is already present.
              local_missing=[new for new in mapping.values() if new not in t]
              if local_missing:
                  raise SystemExit('Anubis URL anchors missing: '+repr(missing)+'; local paths missing: '+repr(local_missing))
          for old,new in mapping.items():
              t=t.replace(old,new)
          p.write_text(t,encoding='utf-8')
          PY

      - name: Refresh persistent asset cache
        run: python .github/update_asset_cache.py

      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script>(.*?)</script>',html,re.S)
          if not blocks: raise SystemExit('No classic script block found')
          Path('/tmp/rampage-main.js').write_text(blocks[-1],encoding='utf-8')
          PY
          node --check /tmp/rampage-main.js

      - name: Validate local Anubis assets
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('index.html').read_text(encoding='utf-8')
          required=[
            'assets/egypt/anubis/card.png',
            "anubisIdle:'assets/egypt/anubis/idle.gif'",
            "anubisWalk:'assets/egypt/anubis/walk.gif'",
            "anubisMeleeAttack:'assets/egypt/anubis/attack-melee.gif'",
            "anubisRangedAttack:'assets/egypt/anubis/attack-ranged.gif'",
            "anubisProjectile:'assets/egypt/anubis/projectile.gif'",
          ]
          missing=[x for x in required if x not in t]
          if missing: raise SystemExit('Missing local Anubis paths: '+repr(missing))
          urls=[
            'https://i.postimg.cc/MHQbVVvH/card-anubbis-do-egito.png',
            'https://i.postimg.cc/3R6FknJw/annubis-andando.gif',
            'https://i.postimg.cc/1tTr8J5R/annubis-parado.gif',
            'https://i.postimg.cc/L51BLLn2/ataque-normal-annubis.gif',
            'https://i.postimg.cc/XJXgNTWf/ataque-a-distancia-annubis.gif',
            'https://i.postimg.cc/gJ5HxNkm/power-annubis.gif',
          ]
          remain=[u for u in urls if u in t]
          if remain: raise SystemExit('Postimg Anubis URLs still present: '+repr(remain))
          for path in [
            'assets/egypt/anubis/card.png',
            'assets/egypt/anubis/walk.gif',
            'assets/egypt/anubis/idle.gif',
            'assets/egypt/anubis/attack-melee.gif',
            'assets/egypt/anubis/attack-ranged.gif',
            'assets/egypt/anubis/projectile.gif',
          ]:
              if not Path(path).is_file() or Path(path).stat().st_size<=0:
                  raise SystemExit('Missing asset file: '+path)
          print('Anubis is fully local and validated.')
          PY
          git diff --check

      - name: Publish
        run: |
          if git diff --quiet -- index.html sw.js assets/egypt/anubis; then
            echo 'No localization changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js assets/egypt/anubis
          git commit -m 'Store Egypt Anubis assets in repository'
          git push origin main
