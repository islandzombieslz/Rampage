name: Validate Isolated PvP
on:
  push:
    branches: [main, 'fix/**']
    paths:
      - 'index.html'
      - 'history-server/src/index.js'
      - 'history-server/src/map.js'
      - 'assets/history/**'
      - 'tests/history-rules-regression.cjs'
      - 'tests/history-map-v5-regression.cjs'
      - 'scripts/import-history-map.py'
      - 'tests/history-smoke.cjs'
      - 'tests/pvp-smoke.cjs'
      - 'tests/war-preservation.cjs'
      - 'tests/pvp-browser-smoke.cjs'
      - 'tests/performance-network-smoke.cjs'
      - 'tests/battle-load-browser.cjs'
      - 'sw.js'
      - 'assets/runtime/**'
      - 'tests/display-sprites-smoke.cjs'
      - '.github/update_asset_cache.py'
      - '.github/rebalance_war_units_v3.py'
      - '.github/workflows/validate-pvp.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'history-server/src/index.js'
      - 'history-server/src/map.js'
      - 'assets/history/**'
      - 'tests/history-rules-regression.cjs'
      - 'tests/history-map-v5-regression.cjs'
      - 'scripts/import-history-map.py'
      - 'tests/history-smoke.cjs'
      - 'tests/pvp-smoke.cjs'
      - 'tests/war-preservation.cjs'
      - 'tests/pvp-browser-smoke.cjs'
      - 'tests/performance-network-smoke.cjs'
      - 'tests/battle-load-browser.cjs'
      - 'sw.js'
      - 'assets/runtime/**'
      - 'tests/display-sprites-smoke.cjs'
      - '.github/update_asset_cache.py'
      - '.github/rebalance_war_units_v3.py'
      - '.github/workflows/validate-pvp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PvP mechanics and UI regression
        run: node tests/pvp-smoke.cjs
      - name: History mechanics, audio and Cloudflare syntax
        run: |
          node --check history-server/src/index.js
          node tests/history-smoke.cjs
      - name: Ensure core War mechanics are unchanged
        run: node tests/war-preservation.cjs
      - name: Stress targeting, clock and regional network races
        run: node tests/performance-network-smoke.cjs

      - name: Preserve every display animation and the cache across regeneration
        run: node tests/display-sprites-smoke.cjs

  browser:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install headless browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise PvP lobby and match in a real browser
        run: node tests/pvp-browser-smoke.cjs
      - name: Exercise real sprites and large battles
        if: success() || failure()
        run: node tests/battle-load-browser.cjs
      - name: Save battle performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battle-load-results
          path: test-results/
          if-no-files-found: ignore
