name: Persistent asset cache

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - '.github/update_asset_cache.py'
      - '.github/workflows/asset-cache.yml'

permissions:
  contents: write

concurrency:
  group: rampage-persistent-asset-cache
  cancel-in-progress: false

jobs:
  update-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh branch
        run: git pull --rebase origin main

      - name: Generate persistent cache manifest
        run: python .github/update_asset_cache.py

      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S)
          assert scripts, 'No inline script found'
          Path('/tmp/rampage-main.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/rampage-main.js
          node --check sw.js

      - name: Validate cache system
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          required=[
            'PERSISTENT ASSET CACHE 2026-09-12',
            'const BOOT_ASSET_MANIFEST=Object.freeze(',
            "const BOOT_CACHE_NAME='rampage-assets-v3';",
            "const BOOT_MANIFEST_KEY='rampageAssetManifestV3';",
            'const BOOT_FETCH_CONCURRENCY=8;',
            'await cache.match(url)',
            'bootFetchAndStore(url,revision,cache)',
            "navigator.serviceWorker.register('./sw.js'",
            'NetworkAdapter.ensureAuth().catch(()=>{});',
            "setBootTitle('VERIFICANDO ARQUIVOS')",
            'ROOM LIFECYCLE 2026-09-09',
            'BROWN WARRIOR SYSTEM 2026-09-12'
          ]
          missing=[x for x in required if x not in t]
          assert not missing, 'Missing cache/preserved markers: '+repr(missing)
          assert 'BOOT_ASSET_URLS' not in t, 'Old always-download loader remains'
          assert 'await Promise.race([NetworkAdapter.ensureAuth()' not in t, 'Firebase still blocks boot loader'
          assert "const CACHE_NAME='rampage-assets-v3';" in sw
          assert "url.searchParams.has('rampageRev')" in sw
          assert "await self.clients.claim();" in sw
          print('Persistent asset cache validation passed.')
          PY

      - name: Publish cache manifest
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          if git diff --cached --quiet; then
            echo 'Asset cache already current.'
            exit 0
          fi
          git commit -m 'Use persistent versioned asset cache'
          git push
