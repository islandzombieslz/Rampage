name: Validate Alpha Intro Viewport

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/add_boot_intro.py'
      - '.github/workflows/validate-alpha-intro-viewport.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate full-screen game and forced-landscape intro
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text(encoding='utf-8')
          required=[
            '#bootIntro{',
            'position:fixed;',
            'width:100vw;',
            'height:100vh;',
            "BOOT_INTRO_VIDEO_ID='j84JmKNz_5Q'",
            'function syncBootIntroLandscape(){',
            'const viewW=portrait?rawH:rawW;',
            'const coverW=Math.max(viewW,viewH*(16/9));',
            'bindBootIntroLandscape();',
            'syncBootIntroLandscape();',
            'await bootIntroDone;',
            'startBootIntro();',
            '#landscapeRoot{',
            'function refreshMobileViewportLayout(){',
            'const rawW=Math.max(1,innerWidth||document.documentElement.clientWidth||1);',
            'function applyLandscapeFallback(){',
          ]
          missing=[x for x in required if x not in t]
          if missing:
              raise SystemExit('Missing full-screen game/forced-landscape intro rule: '+repr(missing))

          intro=t[t.index("/* ===== ALPHA YOUTUBE BOOT INTRO 2026-09-18 ===== */"):t.index('function bootReadSavedManifest')]
          forbidden=['window.visualViewport','applyLandscapeFallback()','try{resize()}']
          bad=[x for x in forbidden if x in intro]
          if bad:
              raise SystemExit('Intro is tied to game or shrinking visual viewport: '+repr(bad))

          # The root must no longer be forced to the shrinking dynamic viewport.
          mobile=t[t.index('/* ===== MOBILE: CONTROLES SEM CORTAR ===== */'):t.index('/* ===== HUD PVE MINIMALISTA ===== */')]
          if 'width:100dvw;' in mobile or 'height:100dvh;' in mobile:
              raise SystemExit('Game root still uses shrinking dynamic viewport units')

          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',t,re.S)
          assert scripts
          Path('/tmp/rampage.js').write_text(scripts[-1],encoding='utf-8')
          print('Game fills the layout viewport and intro stays horizontal.')
          PY
          node --check /tmp/rampage.js
