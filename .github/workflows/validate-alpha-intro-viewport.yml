name: Validate Alpha Intro Viewport

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/add_boot_intro.py'
      - '.github/workflows/validate-alpha-intro-viewport.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate isolated full-screen intro
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text(encoding='utf-8')
          required=[
            '#bootIntro{position:absolute;inset:0;',
            'width:100dvw;',
            'height:56.25dvw;',
            'min-width:177.78dvh;',
            '@media (orientation:portrait) and (max-width:900px){',
            'width:100dvh;',
            'height:56.25dvh;',
            'min-width:177.78dvw;',
            'rotate(90deg)',
            "BOOT_INTRO_VIDEO_ID='j84JmKNz_5Q'",
            'function startBootIntro(){',
            'await bootIntroDone;',
            'startBootIntro();',
            '#landscapeRoot{',
            'width:100dvw;',
            'height:100dvh;',
            'function refreshMobileViewportLayout(){',
            'function applyLandscapeFallback(){',
          ]
          missing=[x for x in required if x not in t]
          if missing:
              raise SystemExit('Missing full-screen intro/game viewport rule: '+repr(missing))

          intro=t[t.index("/* ===== ALPHA YOUTUBE BOOT INTRO 2026-09-18 ===== */"):t.index('function bootReadSavedManifest')]
          forbidden=[
            'syncBootIntroViewport',
            'bindBootIntroViewport',
            'bootIntroViewportCleanup',
            'applyLandscapeFallback()',
            'try{resize()}',
            'intro.style.width',
            'intro.style.height',
            'window.visualViewport',
          ]
          bad=[x for x in forbidden if x in intro]
          if bad:
              raise SystemExit('Intro is still modifying game/mobile viewport: '+repr(bad))

          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',t,re.S)
          assert scripts
          Path('/tmp/rampage.js').write_text(scripts[-1],encoding='utf-8')
          print('Intro is isolated; original game full-screen viewport remains intact.')
          PY
          node --check /tmp/rampage.js
