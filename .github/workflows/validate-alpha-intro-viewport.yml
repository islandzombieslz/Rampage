name: Validate Alpha Intro Viewport

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/add_boot_intro.py'
      - '.github/workflows/validate-alpha-intro-viewport.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate intro viewport geometry
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text(encoding='utf-8')
          required=[
            'function syncBootIntroViewport(){',
            "const vw=Math.max(1,Math.round(window.innerWidth||document.documentElement.clientWidth||1));",
            "const vh=Math.max(1,Math.round(window.innerHeight||document.documentElement.clientHeight||1));",
            "const portrait=vh>vw;",
            "intro.style.width=(portrait?vh:vw)+'px';",
            "intro.style.height=(portrait?vw:vh)+'px';",
            "rotate('+(portrait?'90deg':'0deg')+')",
            "window.addEventListener('pageshow',sync",
            "document.addEventListener('visibilitychange',sync",
            'bindBootIntroViewport();',
            'try{applyLandscapeFallback()}catch(_){}',
            'try{resize()}catch(_){}',
          ]
          missing=[x for x in required if x not in t]
          if missing: raise SystemExit('Missing intro viewport fix: '+repr(missing))
          intro=t[t.index('function syncBootIntroViewport(){'):t.index('function bindBootIntroViewport(){')]
          if 'visualViewport' in intro:
              raise SystemExit('Intro must not depend on visualViewport')
          if '@media (orientation:portrait){\n  #bootIntro{' in t:
              raise SystemExit('Old orientation-media intro sizing still present')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',t,re.S)
          assert scripts
          Path('/tmp/rampage.js').write_text(scripts[-1],encoding='utf-8')
          print('Alpha intro viewport geometry validated.')
          PY
          node --check /tmp/rampage.js
