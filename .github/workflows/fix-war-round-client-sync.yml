name: Corrigir troca de rodada online no modo Guerra

on:
  push:
    paths:
      - '.github/workflows/fix-war-round-client-sync.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir sincronização da transição de rodada
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '// REMOTE WAR ROUND TRANSITION SYNC'

          if marker not in text:
              old_head = """  const firstFrame=$('#gameScreen').style.display==='none';
  state.mode=game.mode??state.mode;state.round=game.round??state.round;state.rounds=game.rounds??state.rounds;state.phase=game.phase??state.phase;state.running=!!game.running;state.timeLeft=game.timeLeft??0;state.prepLeft=game.prepLeft??0;state.nextId=game.nextId??state.nextId;
"""
              new_head = """  const firstFrame=$('#gameScreen').style.display==='none';
  // Guarda o estado anterior para o cliente detectar a troca de rodada ordenada pelo host.
  const previousMode=state.mode;
  const previousRound=Number(state.round)||0;
  const previousPhase=state.phase;
  state.mode=game.mode??state.mode;state.round=game.round??state.round;state.rounds=game.rounds??state.rounds;state.phase=game.phase??state.phase;state.running=!!game.running;state.timeLeft=game.timeLeft??0;state.prepLeft=game.prepLeft??0;state.nextId=game.nextId??state.nextId;
"""
              if old_head not in text:
                  raise SystemExit('Cabeçalho esperado de applyRemoteGame não encontrado')
              text = text.replace(old_head, new_head, 1)

              old_tail = """  }
  if(firstFrame){navigateScreen('gameScreen');configureGameScreenForMode();if(state.mode==='war')beginWarCameraIntro()}
  if(state.phase==='finished'&&!NetworkAdapter.remoteFinishScheduled){NetworkAdapter.remoteFinishScheduled=true;flash('PARTIDA ENCERRADA',3);setTimeout(()=>{navigateScreen('menuScreen');state.entities=[];clearEntityVisuals();NetworkAdapter.remoteFinishScheduled=false},3600)}
}
function configureGameScreenForMode(){
"""
              new_tail = """  }

  // REMOTE WAR ROUND TRANSITION SYNC
  // O host é o único que executa setupWarRound(). O cliente NÃO recria a rodada,
  // não compra bots e não recalcula gemas: ele apenas reproduz os efeitos locais
  // da transição quando o snapshot autoritativo informa uma nova rodada.
  const remoteWarRoundChanged=
    !firstFrame &&
    state.mode==='war' &&
    Number(state.round)!==previousRound &&
    (state.phase==='prep' || previousPhase==='between');

  if(remoteWarRoundChanged){
    // Remove imediatamente tropas e efeitos visuais da rodada anterior.
    // state.entities já contém exclusivamente o snapshot novo recebido do host.
    state.particles=[];
    clearEntityVisuals();

    // Cancela estados locais que não devem atravessar uma rodada.
    state.spectator={active:false,transitioning:false,deathEntityId:null,fadeStart:0,activateAt:0,targetId:null};
    $('#gameScreen').classList.remove('spectator-mode');
    const deathFade=$('#deathFade');
    if(deathFade){
      deathFade.classList.remove('fade-in','fade-out');
      deathFade.style.opacity='0';
    }
    $('#shop').classList.remove('open');

    // Reproduz para o convidado exatamente a apresentação local que o host recebe:
    // centro do mapa -> deslize suave até o território/spawn DESTE jogador.
    beginWarCameraIntro();
    flash(`PREPARAÇÃO • RODADA ${state.round}`,1.3);
  }

  if(firstFrame){navigateScreen('gameScreen');configureGameScreenForMode();if(state.mode==='war')beginWarCameraIntro()}
  if(state.phase==='finished'&&!NetworkAdapter.remoteFinishScheduled){NetworkAdapter.remoteFinishScheduled=true;flash('PARTIDA ENCERRADA',3);setTimeout(()=>{navigateScreen('menuScreen');state.entities=[];clearEntityVisuals();NetworkAdapter.remoteFinishScheduled=false},3600)}
}
function configureGameScreenForMode(){
"""
              if old_tail not in text:
                  raise SystemExit('Final esperado de applyRemoteGame não encontrado')
              text = text.replace(old_tail, new_tail, 1)

          # Robustez adicional: ao assinar uma nova sala, não herdar sequência de snapshots
          # nem flags de finalização da sala anterior.
          old_sub = """  subscribeRoom(code){
    this.roomUnsubscribes.forEach(fn=>fn());this.roomUnsubscribes=[];this.roomCache={};
    this.waitFirebase().then(F=>{
"""
          new_sub = """  subscribeRoom(code){
    this.roomUnsubscribes.forEach(fn=>fn());this.roomUnsubscribes=[];this.roomCache={};
    this.lastRemoteSeq=0;
    this.remoteFinishScheduled=false;
    this.processedCommands.clear();
    this.waitFirebase().then(F=>{
"""
          if old_sub in text:
              text = text.replace(old_sub, new_sub, 1)
          elif 'this.lastRemoteSeq=0;' not in text[text.find('subscribeRoom(code){'):text.find('subscribeRoom(code){')+500]:
              raise SystemExit('subscribeRoom não encontrado para reset de sessão')

          path.write_text(text, encoding='utf-8')

      - name: Validar alteração
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'REMOTE WAR ROUND TRANSITION SYNC' index.html
          grep -q 'Number(state.round)!==previousRound' index.html
          grep -q 'beginWarCameraIntro();' index.html
          grep -q 'this.lastRemoteSeq=0;' index.html
          ! grep -q 'i.postimg.cc' index.html
          test "$(find assets -type f | wc -l)" -eq 28

      - name: Publicar correção
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Correção já aplicada.'
            exit 0
          fi
          git commit -m 'Fix non-host war round transitions'
          git push
