name: Fix war round client sync

on:
  push:
    paths:
      - '.github/workflows/fix-war-round-client-sync.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch non-host round transition
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '// REMOTE WAR ROUND TRANSITION SYNC'

          if marker not in text:
              old = "  const firstFrame=$('#gameScreen').style.display==='none';\n  state.mode=game.mode??state.mode;state.round=game.round??state.round;state.rounds=game.rounds??state.rounds;state.phase=game.phase??state.phase;state.running=!!game.running;state.timeLeft=game.timeLeft??0;state.prepLeft=game.prepLeft??0;state.nextId=game.nextId??state.nextId;\n"
              new = "  const firstFrame=$('#gameScreen').style.display==='none';\n  const previousRound=Number(state.round)||0;\n  const previousPhase=state.phase;\n  state.mode=game.mode??state.mode;state.round=game.round??state.round;state.rounds=game.rounds??state.rounds;state.phase=game.phase??state.phase;state.running=!!game.running;state.timeLeft=game.timeLeft??0;state.prepLeft=game.prepLeft??0;state.nextId=game.nextId??state.nextId;\n"
              if old not in text:
                  raise SystemExit('applyRemoteGame header not found')
              text = text.replace(old, new, 1)

              needle = "  if(firstFrame){navigateScreen('gameScreen');configureGameScreenForMode();if(state.mode==='war')beginWarCameraIntro()}\n"
              insert = """  // REMOTE WAR ROUND TRANSITION SYNC
  // O host continua sendo a única autoridade da rodada. O convidado apenas
  // reproduz localmente a limpeza visual e a animação da câmera ao receber
  // do Firebase uma nova rodada já preparada pelo host.
  const remoteWarRoundChanged=!firstFrame&&state.mode==='war'&&Number(state.round)!==previousRound&&state.phase==='prep';
  if(remoteWarRoundChanged){
    state.particles=[];
    clearEntityVisuals();
    state.spectator={active:false,transitioning:false,deathEntityId:null,fadeStart:0,activateAt:0,targetId:null};
    $('#gameScreen').classList.remove('spectator-mode');
    const deathFade=$('#deathFade');
    if(deathFade){deathFade.classList.remove('fade-in','fade-out');deathFade.style.opacity='0'}
    $('#shop').classList.remove('open');
    beginWarCameraIntro();
    flash(`PREPARAÇÃO • RODADA ${state.round}`,1.3);
  }
  if(firstFrame){navigateScreen('gameScreen');configureGameScreenForMode();if(state.mode==='war')beginWarCameraIntro()}
"""
              if needle not in text:
                  raise SystemExit('applyRemoteGame tail not found')
              text = text.replace(needle, insert, 1)

          sub_old = "  subscribeRoom(code){\n    this.roomUnsubscribes.forEach(fn=>fn());this.roomUnsubscribes=[];this.roomCache={};\n    this.waitFirebase().then(F=>{\n"
          sub_new = "  subscribeRoom(code){\n    this.roomUnsubscribes.forEach(fn=>fn());this.roomUnsubscribes=[];this.roomCache={};\n    this.lastRemoteSeq=0;this.remoteFinishScheduled=false;this.processedCommands.clear();\n    this.waitFirebase().then(F=>{\n"
          if sub_old in text:
              text = text.replace(sub_old, sub_new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'REMOTE WAR ROUND TRANSITION SYNC' index.html
          grep -q 'remoteWarRoundChanged' index.html
          grep -q 'this.lastRemoteSeq=0' index.html
          ! grep -q 'i.postimg.cc' index.html
          test "$(find assets -type f | wc -l)" -eq 28

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Already applied.'
            exit 0
          fi
          git commit -m 'Fix non-host war round transitions'
          git push
