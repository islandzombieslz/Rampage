name: Room codes gems and compact bars

on:
  push:
    paths:
      - '.github/patch_room_codes_gems_bars.py'
      - '.github/workflows/room-gems-bars.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply room gem and bar compatibility patch
        run: python .github/patch_room_codes_gems_bars.py

      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          t=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',t,re.S)
          assert scripts, 'No inline script found'
          Path('/tmp/rampage-main.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/rampage-main.js

      - name: Validate room gems bars and lifecycle
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('index.html').read_text(encoding='utf-8')
          required=[
            "const ROOM_CODES=['REI','PLEBEU','CONDE','VINHO','FURIA','PAZ','DRAGON'];",
            'const roomCandidates=[...ROOM_CODES].sort(()=>Math.random()-.5);',
            "if(b.dataset.target==='gems') state.gems=clamp(state.gems+dir*100,300,3000);",
            'p.gems=Math.max(0,state.gems+(p.bonusGems||0));',
            'position:absolute;left:15px;top:-3px;width:48px;height:12px;',
            '.hp-bg,.shield-bg{position:absolute;left:0;width:48px',
            '.entity-visual.king-visual .entity-bars{left:36px;top:-4px;width:66px}',
            '.entity-visual.king-visual .shield-bg{width:66px}',
            'ROOM LIFECYCLE 2026-09-09',
            'const ROOM_INACTIVITY_MS=10*60*1000;',
            'async cleanupRooms()',
            'startRoomHeartbeat()',
            "const WAR_UNIT_COSTS=Object.freeze({warrior:50,king:400,golem:550,mage:550,dragon:450});",
            'e.hp=e.maxHp=280;',
            'e.shield=e.maxShield=280;',
            'e.damage=35;',
            'e.hp=e.maxHp=150;',
            'e.shield=e.maxShield=100;',
            'WAR CAMERA COMPOSITOR 2026-09-09',
            'GIF SWITCH STABILITY 2026-09-08',
            'WAR FPS SWEEP 2026-09-09',
            'FIREBASE RTDB, HOST AUTORITATIVO',
          ]
          missing=[m for m in required if m not in t]
          assert not missing, 'Missing markers: '+repr(missing)
          forbidden=[
            'const ROOM_COLOR_NAMES=[',
            "const ROOM_CODES=['REI','PLEBEU','CONDE'];",
            'p.gems=clamp(state.gems+(p.bonusGems||0),0,3000);',
          ]
          present=[m for m in forbidden if m in t]
          assert not present, 'Old behavior remains: '+repr(present)
          assert t.count('https://i.postimg.cc/')==2, 'Arena external asset count changed'
          print('Room/gems/bars/lifecycle validation passed.')
          PY

      - name: Publish compatibility changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No generated index changes needed.'
            exit 0
          fi
          git commit -m 'Keep room lifecycle and current balance settings'
          git push
