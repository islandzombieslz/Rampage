name: Room codes gems and compact bars

on:
  push:
    paths:
      - '.github/patch_room_codes_gems_bars.py'
      - '.github/workflows/room-gems-bars.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply requested room gem and bar changes
        run: python .github/patch_room_codes_gems_bars.py

      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          t=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',t,re.S)
          assert scripts, 'No inline script found'
          Path('/tmp/rampage-main.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/rampage-main.js

      - name: Validate requested behavior and preserved systems
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('index.html').read_text(encoding='utf-8')
          required=[
            "const ROOM_CODES=['REI','PLEBEU','CONDE'];",
            'return ROOM_CODES[Math.floor(Math.random()*ROOM_CODES.length)];',
            "if(b.dataset.target==='gems') state.gems=clamp(state.gems+dir*100,300,3000);",
            'p.gems=Math.max(0,state.gems+(p.bonusGems||0));',
            'position:absolute;left:11px;top:-7px;width:56px;height:12px;',
            '.hp-bg,.shield-bg{position:absolute;left:0;width:56px',
            '.entity-visual.king-visual .entity-bars{left:31px;top:-8px;width:76px}',
            '.entity-visual.king-visual .shield-bg{width:76px}',
            'WAR CAMERA COMPOSITOR 2026-09-09',
            "const WAR_ARENA_INSET={left:270,right:270,top:275,bottom:245};",
            'GIF SWITCH STABILITY 2026-09-08',
            'WAR FPS SWEEP 2026-09-09',
            'FIREBASE RTDB, HOST AUTORITATIVO',
            'e.hp=e.maxHp=200',
            'e.shield=e.maxShield=200',
            'e.damage=25',
          ]
          missing=[m for m in required if m not in t]
          assert not missing, 'Missing markers: '+repr(missing)
          forbidden=[
            'const ROOM_COLOR_NAMES=[',
            "return ROOM_COLOR_NAMES[ai]+'-'+ROOM_COLOR_NAMES[bi];",
            'p.gems=clamp(state.gems+(p.bonusGems||0),0,3000);',
          ]
          present=[m for m in forbidden if m in t]
          assert not present, 'Old behavior remains: '+repr(present)
          assert t.count('https://i.postimg.cc/')==2, 'Arena external asset count changed'
          print('Room/gems/bars validation passed.')
          PY

      - name: Publish requested changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No generated index changes needed.'
            exit 0
          fi
          git commit -m 'Use royal room codes and allow earned gems over cap'
          git push
