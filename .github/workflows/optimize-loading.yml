name: War performance and visual validation

on:
  push:
    paths:
      - '.github/workflows/optimize-loading.yml'
      - '.github/patch_war_performance.py'
      - '.github/patch_war_scene.py'
      - '.github/patch_war_inner_bounds.py'
      - '.github/patch_gif_stability.py'
      - '.github/patch_war_fps.py'
      - '.github/patch_war_fps_followup.py'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reviewed performance patch when needed
        run: |
          if grep -q 'const dragonProjectilePool=\[\];' index.html && grep -q "'attacking-alt'" index.html; then
            echo 'Deep performance patch already present; skipping re-application.'
          else
            python .github/patch_war_performance.py
          fi

      - name: Preserve visuals and Golem FX helper scope
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')

          t=t.replace("const typeScale=e.type==='golem'?1.34:e.type==='mage'?.96:e.type==='dragon'?1.16:e.type==='king'?.96:1;", "const typeScale=e.type==='golem'?1.34:e.type==='mage'?0.96:e.type==='dragon'?1.16:e.type==='king'?0.96:1;")
          t=t.replace("layer.style.backgroundPosition=count===3?'28% 55%,68% 38%,51% 70%':'28% 55%,68% 38%';", "layer.style.backgroundPosition=count===3?'7.78px 28.3px,38.18px 15.38px,25.26px 39.7px':'7.78px 28.3px,38.18px 15.38px';")

          nested = """function spawnGolemRockBurst(golem){
          function acquireGolemRockNode(){
           let rock=golemRockPool.pop();
           if(!rock){rock=document.createElement('img');rock.className='golem-rock-fragment';rock.src=ASSETS.golemRocks}
           if(!rock.hasAttribute('src'))rock.src=ASSETS.golemRocks;
           if(rock.parentElement!==combatFxLayer)combatFxLayer?.appendChild(rock);
           rock.style.visibility='visible';
           return rock;
          }
          function recycleGolemRockNode(rock){
           if(!rock)return;
           rock.style.visibility='hidden';
           if(golemRockPool.length<MAX_GOLEM_ROCK_POOL)golemRockPool.push(rock);
           else rock.remove();
          }

          """
          fixed = """function acquireGolemRockNode(){
           let rock=golemRockPool.pop();
           if(!rock){rock=document.createElement('img');rock.className='golem-rock-fragment';rock.src=ASSETS.golemRocks}
           if(!rock.hasAttribute('src'))rock.src=ASSETS.golemRocks;
           if(rock.parentElement!==combatFxLayer)combatFxLayer?.appendChild(rock);
           rock.style.visibility='visible';
           return rock;
          }
          function recycleGolemRockNode(rock){
           if(!rock)return;
           rock.style.visibility='hidden';
           if(golemRockPool.length<MAX_GOLEM_ROCK_POOL)golemRockPool.push(rock);
           else rock.remove();
          }

          function spawnGolemRockBurst(golem){
          """
          if nested in t:
              t=t.replace(nested,fixed,1)
          if "function spawnGolemRockBurst(golem){\nfunction acquireGolemRockNode(){" in t:
              raise SystemExit('Golem FX helpers are still nested')
          p.write_text(t,encoding='utf-8')
          PY

      - name: Apply War arena scene when needed
        run: |
          if grep -q 'id="warBarrierSprite"' index.html && grep -q "warFloorImage.src='https://i.postimg.cc/6qYQzvPc/bff3bb67-8426-4656-bdee-1313473758e2.png'" index.html; then
            echo 'War arena scene already present; skipping base scene patch.'
          else
            python .github/patch_war_scene.py
          fi

      - name: Apply War inner bounds
        run: python .github/patch_war_inner_bounds.py

      - name: Apply GIF switch stability
        run: python .github/patch_gif_stability.py

      - name: Apply deep War FPS sweep
        run: python .github/patch_war_fps.py

      - name: Guard cached War candidates
        run: python .github/patch_war_fps_followup.py

      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          t=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',t,re.S)
          assert scripts, 'No inline script found'
          Path('/tmp/rampage-main.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/rampage-main.js

      - name: Validate preserved systems and FPS fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('index.html').read_text(encoding='utf-8')

          required=[
            'FIREBASE RTDB, HOST AUTORITATIVO',
            'e.hp=e.maxHp=200',
            'e.shield=e.maxShield=200',
            'e.damage=25',
            'kingNormalCount)||0)>=6',
            'entity-visual.king-visual',
            'entity-visual.king-visual .entity-king-special',
            'const kingPowerNodes=new Map()',
            'function syncKingPowerEffects',
            'syncKingPowerEffects(left,top,zoom,vw,vh)',
            "e.type==='mage'?0.96",
            '7.78px 28.3px',
            'const warEntityById=new Map()',
            'const dragonProjectilePool=[];',
            'const golemRockPool=[];',
            "'attacking-alt'",
            "'hit-react-alt'",
            'function acquireGolemRockNode()',
            'function recycleGolemRockNode(rock)',
            'REMOTE WAR ROUND TRANSITION SYNC',
            'id="warBarrierSprite"',
            'id="warBarrierTopSprite"',
            'https://i.postimg.cc/6qYQzvPc/bff3bb67-8426-4656-bdee-1313473758e2.png',
            'https://i.postimg.cc/fywLxK8B/1919c5cb-ace6-4da5-b8f0-6db8bfb24c89.png',
            'syncWarArenaOverlay(left,top,zoom)',
            'state.world.w=1850;state.world.h=1542',
            'world:{w:state.world.w,h:state.world.h}',
            'const WAR_ARENA_INSET={left:270,right:270,top:275,bottom:245};',
            'const WAR_SPAWN_INSET=125;',
            'function warArenaBounds(radius=0)',
            'function constrainWarEntityToArena(e)',
            'const minX=b.left+WAR_SPAWN_INSET,maxX=b.right-WAR_SPAWN_INSET;',
            '#warBarrierTopSprite{z-index:1',
            '#warBarrierSprite{z-index:4',
            'clip-path:polygon(12% 0,88% 0,88% 22%,12% 22%)',
            'function syncWarBarrierNode(node,x,y,w,h)',
            'syncWarBarrierNode(warBarrierTopSprite,x,y,w,h);',
            'GIF SWITCH STABILITY 2026-09-08',
            'const ENTITY_LOOP_GIF_GRACE_MS=1400;',
            'function scheduleEntityLoopGifSuspend(el,stateName)',
            "img.style.display=active?'block':'none';",
            'scheduleEntityLoopGifSuspend(el,previous);',
            'for(const stateName of ENTITY_LOOP_STATE_LIST)',
            'const DRAGON_PROJECTILE_GIF_GRACE_MS=850;',
            "for(const img of el.querySelectorAll('img'))img.decoding='async';",
            "restartGif(el._golemSpecial,'golemSpecial'",
            'restartGif(el._mageSpecial',
            "restartGif(el._kingSpecial,'kingSpecial'",
            "restartGif(el._dragonTakeoff,'dragonTakeoff'",
            "restartGif(el._dragonAttack,'dragonAttack'",
            'WAR FPS SWEEP 2026-09-09',
            "const REAL_COMBAT_TYPES=new Set(['warrior','king','mage','golem','dragon','enemy']);",
            'function nearestEngageableCandidate(e,candidates,forcedTeam=null,nonDragonOnly=false)',
            'const WAR_AI_DECISION_INTERVAL_MS=90;',
            'const WAR_AI_GRID_REFRESH_MS=90;',
            'const WAR_SEPARATION_INTERVAL_SEC=1/30;',
            'const warLivingScratch=[];',
            'if(!warCombatGrid.size||now-warAIGridBuiltAt>=WAR_AI_GRID_REFRESH_MS)',
            'warSeparationAccumulator+=dt;',
            'const margin=170;',
            'const ENTITY_OFFSCREEN_GIF_GRACE_MS=900;',
            'const ENTITY_NODE_RETENTION_MS=5000;',
            'function scheduleEntityOffscreenSuspend(el)',
            'const visualMoving=entityVisualMoving(el,e,localNow);',
            "if(key==='game'&&this.isHost)return;",
            "const networkPushInterval=state.mode==='war'?125:100;",
            'const hitRangeSq=92*92;',
            'WAR FPS CANDIDATE SAFETY 2026-09-09',
            '(forcedTeam&&candidate.team!==forcedTeam)||!canEngageTarget(e,candidate)',
            '(forcedTeam&&t.team!==forcedTeam)||!canEngageTarget(e,t)',
          ]
          missing=[m for m in required if m not in t]
          assert not missing, 'Missing markers: '+repr(missing)

          forbidden=[
            "if(ENTITY_LOOP_STATES.has(previous)&&previous!==desired)stopGif(entitySpriteForState(el,previous));",
            "function spawnGolemRockBurst(golem){\nfunction acquireGolemRockNode()",
            'function tryWarriorFleeFlyingDragon',
            'if(tryWarriorFleeFlyingDragon(e,dt))return;',
            "['warrior','king','mage','golem','dragon','enemy'].includes(t.type)",
            'localNow-lastSeen>1400',
          ]
          present=[m for m in forbidden if m in t]
          assert not present, 'Forbidden old behavior remains: '+repr(present)

          acquire=t.index('function acquireGolemRockNode()')
          recycle=t.index('function recycleGolemRockNode(rock)')
          spawn=t.index('function spawnGolemRockBurst(golem)')
          update=t.index('function updateGolemRockEffects(now)')
          assert acquire < spawn and recycle < spawn < update, 'Golem FX helper scope/order invalid'
          assert t.count('https://i.postimg.cc/')==2, 'Unexpected external arena URL count'

          for p in [
            'assets/king/idle.gif','assets/king/walk.gif','assets/king/special.gif',
            'assets/king/power.gif','assets/king/sword.png'
          ]:
              assert Path(p).is_file(), 'Missing asset: '+p
          print('All War/GIF/FPS validations passed.')
          PY

      - name: Publish correction
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No generated index changes needed.'
            exit 0
          fi
          git commit -m 'Guard cached War targets without extra scans'
          git push
