name: Corrigir tela cheia mobile horizontal

on:
  push:
    paths:
      - '.github/workflows/optimize-loading.yml'

permissions:
  contents: write

jobs:
  fix-mobile-fullscreen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar correção de viewport
        shell: python
        run: |
          from pathlib import Path
          import base64
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = base64.b64decode('').decode()
          new = base64.b64decode('').decode()
          if old not in text:
              raise SystemExit('Bloco antigo de landscape não encontrado')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

      - name: Validar JavaScript
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Landscape físico deve ocupar 100% da viewport real' index.html
          grep -q 'w:rawW,h:rawH,scale:1,offsetX:0,offsetY:0' index.html
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          inline='\n'.join(s for s in scripts if 'https://www.gstatic.com/' not in s)
          Path('/tmp/rampage-inline.js').write_text(inline,encoding='utf-8')
          PY
          node --check /tmp/rampage-inline.js

      - name: Publicar correção
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix mobile landscape fullscreen fit'
          git push
