name: Ajustar voo e balanceamento do Dragão

on:
  push:
    paths:
      - '.github/workflows/optimize-loading.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar ajustes do Dragão
        shell: bash
        run: |
          set -euo pipefail
          python .github/patch_dragon_refinements.py

      - name: Validar JavaScript e regras
        shell: bash
        run: |
          set -euo pipefail
          node --check /tmp/rampage-main.js
          grep -q 'const DRAGON_BURN_DAMAGE=5;' index.html
          grep -q 'aFlyingDragon&&bFlyingDragon?76' index.html
          grep -q 'angle+Math.PI/2' index.html
          grep -q 'dragonLift=36' index.html
          grep -q 'tryWarriorFleeFlyingDragon' index.html
          grep -q 'REMOTE WAR ROUND TRANSITION SYNC' index.html
          ! grep -q 'i.postimg.cc' index.html
          test "$(find assets -type f | wc -l)" -eq 33

      - name: Publicar ajustes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Refine Dragon flight, burn and warrior evasion'
          git push
