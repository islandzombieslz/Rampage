name: Ajustar GIFs e IA do Dragão

on:
  push:
    paths:
      - '.github/workflows/optimize-loading.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar ajustes
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/launchDragonFireball(e,target,{emergency=true})/launchDragonFireball(e,target,{emergency:true})/' .github/patch_dragon_gif_ai_stability.py
          python .github/patch_dragon_gif_ai_stability.py

      - name: Extrair JavaScript principal
        shell: python
        run: |
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,flags=re.S)
          if not scripts:
              raise SystemExit('Nenhum script encontrado')
          Path('/tmp/rampage-main.js').write_text(max(scripts,key=len),encoding='utf-8')

      - name: Validar JavaScript e regras
        shell: bash
        run: |
          set -euo pipefail
          node --check /tmp/rampage-main.js
          grep -q "let DRAGON_ATTACK_VISUAL_MS=1800;" index.html
          grep -q "if(key==='dragonAttack')DRAGON_ATTACK_VISUAL_MS=validGifDuration" index.html
          grep -q "DRAGON_CLOSE_SHOT_COOLDOWN_MS=5000" index.html
          grep -q "function updateWarBotPurchases(now,force=false)" index.html
          grep -q "function chooseBotWarPurchase(p)" index.html
          grep -q "_dragonAttackVisualEndAt" index.html
          grep -q "_spriteSwitchToken" index.html
          grep -q "launchDragonFireball(e,target,{emergency:true})" index.html
          grep -q "REMOTE WAR ROUND TRANSITION SYNC" index.html
          ! grep -q "const DRAGON_ATTACK_VISUAL_MS=850;" index.html
          ! grep -q 'i.postimg.cc' index.html
          test "$(find assets -type f | wc -l)" -eq 33

      - name: Publicar ajustes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Stabilize Dragon GIFs and improve war bot strategy'
          git push
