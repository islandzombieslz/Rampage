name: Otimizar carregamento dos assets

on:
  push:
    paths:
      - '.github/workflows/optimize-loading.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Otimizar prioridade de carregamento
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          marker = '<!-- ASSET-LOADING-OPTIMIZATION -->'
          if marker not in text:
              block = '''\n<!-- ASSET-LOADING-OPTIMIZATION -->\n<link rel="preload" as="image" href="assets/ui/background-menu.png" fetchpriority="high">\n<link rel="preload" as="image" href="assets/ui/criar-partida.png" fetchpriority="high">\n<link rel="preload" as="image" href="assets/ui/usar-codigo.png" fetchpriority="high">\n<link rel="prefetch" as="image" href="assets/ui/botao-pvp.png">\n<link rel="prefetch" as="image" href="assets/ui/botao-mestre-da-guerra.png">\n<link rel="prefetch" as="image" href="assets/ui/pvp-menu.png">\n<link rel="prefetch" as="image" href="assets/ui/mestre-da-guerra-menu.png">\n'''
              text = text.replace('<title>Guerra de Clãs — Protótipo</title>', '<title>Guerra de Clãs — Protótipo</title>' + block, 1)

          replacements = {
              '<img id="menuWallpaper" src="assets/ui/background-menu.png" alt="" draggable="false">':
                  '<img id="menuWallpaper" src="assets/ui/background-menu.png" alt="" draggable="false" loading="eager" decoding="async" fetchpriority="high">',
              '<img src="assets/ui/criar-partida.png" alt="Criar partida" draggable="false">':
                  '<img src="assets/ui/criar-partida.png" alt="Criar partida" draggable="false" loading="eager" decoding="async" fetchpriority="high">',
              '<img src="assets/ui/usar-codigo.png" alt="Usar código" draggable="false">':
                  '<img src="assets/ui/usar-codigo.png" alt="Usar código" draggable="false" loading="eager" decoding="async" fetchpriority="high">',
              '<img src="assets/ui/botao-pvp.png" alt="Players vs Inimigos" draggable="false">':
                  '<img src="assets/ui/botao-pvp.png" alt="Players vs Inimigos" draggable="false" loading="lazy" decoding="async">',
              '<img src="assets/ui/botao-mestre-da-guerra.png" alt="Mestre da Guerra" draggable="false">':
                  '<img src="assets/ui/botao-mestre-da-guerra.png" alt="Mestre da Guerra" draggable="false" loading="lazy" decoding="async">',
              '<img src="assets/ui/cla-guerreiros.png" alt="">':
                  '<img src="assets/ui/cla-guerreiros.png" alt="" loading="lazy" decoding="async">',
              '<img src="assets/warrior/guerreiro-parado.gif">':
                  '<img src="assets/warrior/guerreiro-parado.gif" loading="lazy" decoding="async">',
              '<img src="assets/mage/mago-parado.gif">':
                  '<img src="assets/mage/mago-parado.gif" loading="lazy" decoding="async">',
              '<img src="assets/golem/golem-parado.gif">':
                  '<img src="assets/golem/golem-parado.gif" loading="lazy" decoding="async">',
          }

          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)

          if 'i.postimg.cc' in text:
              raise SystemExit('Ainda existe referência ao Postimg no index.html')

          required = [
              'assets/ui/background-menu.png',
              'assets/ui/criar-partida.png',
              'assets/ui/usar-codigo.png',
              'fetchpriority="high"',
              'loading="lazy"',
          ]
          for item in required:
              if item not in text:
                  raise SystemExit(f'Validação falhou: {item}')

          path.write_text(text, encoding='utf-8')

      - name: Validar assets locais
        shell: bash
        run: |
          set -euo pipefail
          test "$(find assets -type f | wc -l)" -eq 28
          ! grep -q 'i.postimg.cc' index.html
          grep -q 'ASSET-LOADING-OPTIMIZATION' index.html

      - name: Publicar otimização
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git commit -m 'Optimize local asset loading'
          git push
