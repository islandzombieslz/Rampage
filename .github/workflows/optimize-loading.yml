name: Verificar payload Dragão
on:
  push:
    paths:
      - '.github/workflows/optimize-loading.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hashes
        run: |
          set -euo pipefail
          wc -c .github/dragon_patch/part*.txt
          sha256sum .github/dragon_patch/part*.txt
          cat .github/dragon_patch/part*.txt >/tmp/payload
          wc -c /tmp/payload
          sha256sum /tmp/payload
