name: Ajustar transição online do Dragão
on:
  push:
    paths:
      - '.github/workflows/optimize-loading.yml'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ajustar transição
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          old="""     const attackActive=flight==='flying'&&e.pendingDragonAttack&&Number(e.pendingDragonAttack.endAt||0)>localNow;
     const takeoffActive=flight==='takeoff'&&Number(e.dragonTakeoffEndAt||0)>localNow;
     const desired=attackActive?'dragonAttack':takeoffActive?'takeoff':flight==='flying'?'fly':'ground';
"""
          new="""     const attackActive=flight==='flying'&&e.pendingDragonAttack&&Number(e.pendingDragonAttack.endAt||0)>localNow;
     const takeoffActive=flight==='takeoff'&&Number(e.dragonTakeoffEndAt||0)>localNow;
     // Entre o fim local do GIF e o próximo snapshot do host, mantém o Dragão no ar.
     const visualFlying=flight==='flying'||(flight==='takeoff'&&!takeoffActive);
     const desired=attackActive?'dragonAttack':takeoffActive?'takeoff':visualFlying?'fly':'ground';
"""
          if old not in t: raise SystemExit('Trecho visual do Dragão não encontrado')
          t=t.replace(old,new,1)
          oldz="el.style.zIndex=String((e.type==='dragon'&&e.dragonFlightState==='flying'?900:100)+Math.round(sy));"
          newz="const dragonAbove=e.type==='dragon'&&(e.dragonFlightState==='flying'||(e.dragonFlightState==='takeoff'&&Number(e.dragonTakeoffEndAt||0)<=localNow));\n   el.style.zIndex=String((dragonAbove?900:100)+Math.round(sy));"
          if oldz not in t: raise SystemExit('z-index do Dragão não encontrado')
          t=t.replace(oldz,newz,1)
          p.write_text(t,encoding='utf-8')
      - name: Validar
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text()
          s=re.findall(r'<script(?![^>]*type="module")[^>]*>(.*?)</script>',t,re.S)[-1]
          Path('/tmp/main.js').write_text(s)
          PY
          node --check /tmp/main.js
          grep -q 'const visualFlying=' index.html
          grep -q 'const dragonAbove=' index.html
      - name: Publicar
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Polish Dragon takeoff transition online'
          git push
