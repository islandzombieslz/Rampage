name: Adicionar Dragão Guerreiro

on:
  push:
    paths:
      - '.github/workflows/optimize-loading.yml'

permissions:
  contents: write

jobs:
  add-dragon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar Dragão e corrigir loja
        shell: bash
        run: |
          python - <<'PY'
          import base64,zlib
          exec(zlib.decompress(base64.b64decode('')).decode())
          PY
      - name: Validar JavaScript e assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY_CHECK'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?![^>]*type="module")[^>]*>(.*?)</script>',text,flags=re.S)
          if not scripts: raise SystemExit('Script principal não encontrado')
          Path('/tmp/rampage-main.js').write_text(scripts[-1],encoding='utf-8')
          PY_CHECK
          node --check /tmp/rampage-main.js
          test "$(find assets/dragon -type f -name '*.gif' | wc -l)" -eq 5
          for f in assets/dragon/*.gif; do test "$(head -c 3 "$f")" = "GIF"; done
          grep -q "function aiFightDragon" index.html
          grep -q "DRAGON_BURN_DURATION_MS=6000" index.html
          grep -q "buy-dragon" index.html
          ! grep -q "i.postimg.cc" index.html
      - name: Publicar Dragão
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/dragon
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git commit -m 'Add Dragon warrior troop and secure war shop button'
          git push
