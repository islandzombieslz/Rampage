name: Diagnosticar integração do Dragão

on:
  push:
    paths:
      - '.github/workflows/optimize-loading.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir partes
        shell: bash
        run: |
          set -euo pipefail
          wc -c .github/dragon_patch/part*.txt
          sha256sum .github/dragon_patch/part*.txt
          cat .github/dragon_patch/part*.txt > /tmp/dragon-payload.txt
          echo CONCAT
          wc -c /tmp/dragon-payload.txt
          sha256sum /tmp/dragon-payload.txt
