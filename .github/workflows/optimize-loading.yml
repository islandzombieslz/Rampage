name: Otimizar carregamento dos assets

on:
  push:
    paths:
      - '.github/workflows/optimize-loading.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir sintaxe da viewport mobile
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          bad = "function resize(){\n  refreshMobileViewportLayout(){\n"
          good = "function resize(){\n  refreshMobileViewportLayout();\n"
          if bad in text:
              text = text.replace(bad, good, 1)
          if bad in text or good not in text:
              raise SystemExit('Correção de resize não confirmada')
          if 'MOBILE STABLE LOGICAL VIEWPORT' not in text:
              raise SystemExit('Patch mobile não encontrado')
          path.write_text(text, encoding='utf-8')

          scripts = re.findall(r'<script[^>]*>(.*?)</script>', text, flags=re.S|re.I)
          if not scripts:
              raise SystemExit('Nenhum script encontrado')
          Path('/tmp/rampage-main.mjs').write_text(max(scripts, key=len), encoding='utf-8')

      - name: Validar JavaScript e alterações
        shell: bash
        run: |
          set -euo pipefail
          node --check /tmp/rampage-main.mjs
          grep -q 'MOBILE: SEM DESTAQUE NATIVO + LAYOUT DE REFERÊNCIA' index.html
          grep -q 'MOBILE STABLE LOGICAL VIEWPORT' index.html
          grep -q 'refreshMobileViewportLayout();' index.html
          grep -q -- '-webkit-tap-highlight-color:transparent' index.html
          grep -q 'REMOTE WAR ROUND TRANSITION SYNC' index.html
          ! grep -q 'i.postimg.cc' index.html
          test "$(find assets -type f | wc -l)" -eq 28

      - name: Publicar correção
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git commit -m 'Fix mobile viewport resize syntax'
          git push
