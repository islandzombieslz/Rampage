name: Otimizar carregamento dos assets

on:
  push:
    paths:
      - '.github/workflows/optimize-loading.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar layout mobile estável
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/rampage-mobile-patch.py
          python /tmp/rampage-mobile-patch.py

      - name: Validar correção
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'REMOTE WAR ROUND TRANSITION SYNC' index.html
          grep -q 'MOBILE: SEM DESTAQUE NATIVO + LAYOUT DE REFERÊNCIA' index.html
          grep -q 'MOBILE STABLE LOGICAL VIEWPORT' index.html
          grep -q 'rampagePortraitViewport' index.html
          grep -q -- '-webkit-tap-highlight-color:transparent' index.html
          ! grep -q 'i.postimg.cc' index.html
          test "$(find assets -type f | wc -l)" -eq 28

      - name: Publicar correção
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git commit -m 'Fix mobile landscape proportions and tap focus'
          git push
