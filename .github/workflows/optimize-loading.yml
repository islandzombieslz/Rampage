name: Warrior King visual adjustments

on:
  push:
    paths:
      - '.github/workflows/optimize-loading.yml'
      - '.github/patch_war_performance.py'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reviewed patch
        run: |
          if grep -q 'const dragonProjectilePool=\[\];' index.html && grep -q "'attacking-alt'" index.html; then
            echo 'Deep performance patch already present; skipping re-application.'
          else
            python .github/patch_war_performance.py
          fi

      - name: Preserve visuals and fix Golem FX scope
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')

          # Preserve the requested visual adjustments.
          t=t.replace("const typeScale=e.type==='golem'?1.34:e.type==='mage'?.96:e.type==='dragon'?1.16:e.type==='king'?.96:1;", "const typeScale=e.type==='golem'?1.34:e.type==='mage'?0.96:e.type==='dragon'?1.16:e.type==='king'?0.96:1;")
          t=t.replace("layer.style.backgroundPosition=count===3?'28% 55%,68% 38%,51% 70%':'28% 55%,68% 38%';", "layer.style.backgroundPosition=count===3?'7.78px 28.3px,38.18px 15.38px,25.26px 39.7px':'7.78px 28.3px,38.18px 15.38px';")

          # Regression fix 2026-09-08:
          # the pool helpers were accidentally inserted inside spawnGolemRockBurst().
          # updateGolemRockEffects() calls them from outside, causing ReferenceError and
          # stopping the main game loop while browser-driven GIFs kept animating.
          nested = """function spawnGolemRockBurst(golem){
          function acquireGolemRockNode(){
           let rock=golemRockPool.pop();
           if(!rock){rock=document.createElement('img');rock.className='golem-rock-fragment';rock.src=ASSETS.golemRocks}
           if(!rock.hasAttribute('src'))rock.src=ASSETS.golemRocks;
           if(rock.parentElement!==combatFxLayer)combatFxLayer?.appendChild(rock);
           rock.style.visibility='visible';
           return rock;
          }
          function recycleGolemRockNode(rock){
           if(!rock)return;
           rock.style.visibility='hidden';
           if(golemRockPool.length<MAX_GOLEM_ROCK_POOL)golemRockPool.push(rock);
           else rock.remove();
          }

          """
          fixed = """function acquireGolemRockNode(){
           let rock=golemRockPool.pop();
           if(!rock){rock=document.createElement('img');rock.className='golem-rock-fragment';rock.src=ASSETS.golemRocks}
           if(!rock.hasAttribute('src'))rock.src=ASSETS.golemRocks;
           if(rock.parentElement!==combatFxLayer)combatFxLayer?.appendChild(rock);
           rock.style.visibility='visible';
           return rock;
          }
          function recycleGolemRockNode(rock){
           if(!rock)return;
           rock.style.visibility='hidden';
           if(golemRockPool.length<MAX_GOLEM_ROCK_POOL)golemRockPool.push(rock);
           else rock.remove();
          }

          function spawnGolemRockBurst(golem){
          """
          if nested in t:
              t=t.replace(nested,fixed,1)
          elif "function spawnGolemRockBurst(golem){\nfunction acquireGolemRockNode(){" in t:
              raise SystemExit('Golem FX helpers are still nested in spawnGolemRockBurst')

          p.write_text(t,encoding='utf-8')
          PY

      - name: Check JavaScript syntax
        run: |
          python -c "import re; from pathlib import Path; t=Path('index.html').read_text(encoding='utf-8'); s=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',t,re.S); assert s; Path('/tmp/rampage-main.js').write_text(s[-1],encoding='utf-8')"
          node --check /tmp/rampage-main.js

      - name: Validate preserved systems
        run: |
          set -euo pipefail
          grep -q 'WAR PERFORMANCE 2026-09-08' index.html
          grep -q 'FIREBASE RTDB, HOST AUTORITATIVO' index.html
          grep -q "e.hp=e.maxHp=200" index.html
          grep -q "e.shield=e.maxShield=200" index.html
          grep -q "e.damage=25" index.html
          grep -q "kingNormalCount)||0)>=6" index.html
          grep -q 'entity-visual.king-visual' index.html
          grep -q 'entity-visual.king-visual .entity-king-special' index.html
          grep -q 'const kingPowerNodes=new Map()' index.html
          grep -q 'function syncKingPowerEffects' index.html
          grep -q 'syncKingPowerEffects(left,top,zoom,vw,vh)' index.html
          grep -q "e.type==='mage'?0.96" index.html
          grep -q '7.78px 28.3px' index.html
          grep -q 'const warEntityById=new Map()' index.html
          grep -q 'const dragonProjectilePool=\[\];' index.html
          grep -q 'const golemRockPool=\[\];' index.html
          grep -q "'attacking-alt'" index.html
          grep -q "'hit-react-alt'" index.html
          grep -q 'function acquireGolemRockNode()' index.html
          grep -q 'function recycleGolemRockNode(rock)' index.html
          ! grep -q $'function spawnGolemRockBurst(golem){\nfunction acquireGolemRockNode()' index.html
          python - <<'PY'
          from pathlib import Path
          t=Path('index.html').read_text(encoding='utf-8')
          acquire=t.index('function acquireGolemRockNode()')
          recycle=t.index('function recycleGolemRockNode(rock)')
          spawn=t.index('function spawnGolemRockBurst(golem)')
          update=t.index('function updateGolemRockEffects(now)')
          assert acquire < spawn and recycle < spawn < update, 'Golem FX helper scope/order invalid'
          PY
          grep -q 'REMOTE WAR ROUND TRANSITION SYNC' index.html
          ! grep -q 'i.postimg.cc' index.html
          test -f assets/king/idle.gif
          test -f assets/king/walk.gif
          test -f assets/king/special.gif
          test -f assets/king/power.gif
          test -f assets/king/sword.png

      - name: Publish correction
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Fix Golem FX scope freeze in war mode'
          git push
