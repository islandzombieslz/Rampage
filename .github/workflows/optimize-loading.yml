name: Optimize war performance and Warrior King

on:
  push:
    paths:
      - '.github/workflows/optimize-loading.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reviewed patch
        run: python .github/patch_war_performance.py

      - name: Check JavaScript syntax
        run: |
          python -c "import re; from pathlib import Path; t=Path('index.html').read_text(encoding='utf-8'); s=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',t,re.S); assert s; Path('/tmp/rampage-main.js').write_text(s[-1],encoding='utf-8')"
          node --check /tmp/rampage-main.js

      - name: Validate preserved systems
        run: |
          set -euo pipefail
          grep -q 'WAR PERFORMANCE 2026-09-08' index.html
          grep -q "e.hp=e.maxHp=200" index.html
          grep -q "e.shield=e.maxShield=200" index.html
          grep -q "e.damage=25" index.html
          grep -q "kingNormalCount)||0)>=6" index.html
          grep -q "Math.min(6,(Number(e.kingNormalCount)" index.html
          grep -q 'warCandidatesFor(e,combatGrid,avoidDragons)' index.html
          grep -q 'REMOTE WAR ROUND TRANSITION SYNC' index.html
          grep -q 'FIREBASE RTDB, HOST AUTORITATIVO' index.html
          ! grep -q 'i.postimg.cc' index.html
          test "$(find assets -type f | wc -l)" -eq 33

      - name: Publish correction
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Optimize war performance and tune Warrior King'
          git push
