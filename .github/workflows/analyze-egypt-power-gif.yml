name: Analyze Egypt mage special GIF
on:
  push:
    paths:
      - '.github/workflows/analyze-egypt-power-gif.yml'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Compare special power GIFs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image, ImageChops, ImageStat
          from pathlib import Path
          import hashlib

          def inspect(path):
              im=Image.open(path)
              loop=im.info.get('loop','missing')
              size=im.size
              frames=[]; durations=[]; rgba=[]
              i=0
              while True:
                  try: im.seek(i)
                  except EOFError: break
                  fr=im.convert('RGBA').copy()
                  rgba.append(fr)
                  frames.append(hashlib.md5(fr.tobytes()).hexdigest())
                  durations.append(int(im.info.get('duration',0)))
                  i+=1
              first=rgba[0]
              diffs=[]
              for idx,fr in enumerate(rgba):
                  diff=ImageChops.difference(first,fr)
                  stat=ImageStat.Stat(diff)
                  mean=sum(stat.mean)/len(stat.mean)
                  diffs.append((mean,idx))
              nearest=sorted(diffs[1:])[:12]
              print('\nFILE',path)
              print('size=',size,'frames=',len(frames),'total_ms=',sum(durations),'loop=',loop)
              print('nearest_to_first=',nearest)
              print('durations_head=',durations[:15])
              print('durations_tail=',durations[-15:])
          inspect('assets/egypt/mage/power-special.gif')
          inspect('assets/mage/poder-mago-especial.gif')
          PY
