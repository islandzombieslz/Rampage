name: Analyze Egypt mage special GIF
on:
  push:
    paths:
      - '.github/workflows/analyze-egypt-power-gif.yml'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Analyze decoded frames
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib

          path=Path('assets/egypt/mage/power-special.gif')
          im=Image.open(path)
          frames=[]
          durations=[]
          i=0
          while True:
              try:
                  im.seek(i)
              except EOFError:
                  break
              rgba=im.convert('RGBA')
              frames.append(hashlib.md5(rgba.tobytes()).hexdigest())
              durations.append(int(im.info.get('duration',0)))
              i+=1

          print('frames=',len(frames))
          print('total_ms=',sum(durations))
          print('loop_info=',im.info.get('loop','missing'))
          repeats=[]
          for p in range(2,len(frames)//2+1):
              if frames[:p]==frames[p:2*p]:
                  count=2
                  while (count+1)*p<=len(frames) and frames[:p]==frames[count*p:(count+1)*p]:
                      count+=1
                  repeats.append((p,count,sum(durations[:p])))
          print('prefix_repeats=',repeats[:20])
          positions={}
          for idx,h in enumerate(frames): positions.setdefault(h,[]).append(idx)
          duplicates=[v for v in positions.values() if len(v)>1]
          print('duplicate_frame_groups=',duplicates[:80])
          print('durations=',durations)
          print('hashes=')
          for idx,h in enumerate(frames): print(idx,durations[idx],h)
          PY
