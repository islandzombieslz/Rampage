name: One-time History hit-sync polish v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-history-hit-sync-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch History client
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          def once(old,new,label):
              global s
              count=s.count(old)
              if count!=1:
                  raise SystemExit(f'{label}: expected 1, got {count}')
              s=s.replace(old,new,1)

          once(
          "const HISTORY_RENDER_DELAY_MIN_MS=45;\nconst HISTORY_RENDER_DELAY_MAX_MS=95;\nconst HISTORY_REMOTE_MAX_EXTRAP_MS=120;\nconst HISTORY_INPUT_KEEPALIVE_MS=95;",
          "const HISTORY_RENDER_DELAY_MIN_MS=35;\nconst HISTORY_RENDER_DELAY_MAX_MS=80;\nconst HISTORY_REMOTE_MAX_EXTRAP_MS=105;\nconst HISTORY_INPUT_KEEPALIVE_MS=50;",
          'latency constants')

          anchor="""function historyFindEntity(kind,id){
           return state.entities.find(e=>e.historyServerId===(kind==='dragon'?'dragon:':'player:')+String(id))||null;
          }
          """
          helpers="""function historyFindEntity(kind,id){
           return state.entities.find(e=>e.historyServerId===(kind==='dragon'?'dragon:':'player:')+String(id))||null;
          }
          function historyApplyHitFeedback(e,impact,sourceId=null){
           if(!e)return;
           let dx=Number(impact?.dirX)||0,dy=Number(impact?.dirY)||0,len=Math.hypot(dx,dy);
           if(len<.001&&sourceId){
             const source=historyFindEntity('dragon',sourceId)||historyFindEntity('player',sourceId);
             if(source){dx=e.x-source.x;dy=e.y-source.y;len=Math.hypot(dx,dy)}
           }
           if(len<.001){dx=e.facing<0?-1:1;dy=0;len=1}
           dx/=len;dy/=len;
           e.hitDirX=dx;e.hitDirY=dy;e.hitTilt=Number(impact?.tilt)||7;
           e.hitSerial=(Number(e.hitSerial)||0)+1;e.lastCombatAt=performance.now();
           if(impact&&Number(impact.force)>0&&Number(impact.timeMs)>0){
             e.knockTime=Math.max(Number(e.knockTime)||0,Number(impact.timeMs)/1000);
             e.knockVX=dx*Number(impact.force);e.knockVY=dy*Number(impact.force);e.moving=false;
             e.shakeSerial=(Number(e.shakeSerial)||0)+1;e.shakePower=9;
           }
          }
          function historyResetDeathVisual(e){
           if(!e)return;
           e.deathStarted=0;e.removeAt=0;e.deathDir=0;e.pvpWarriorDeathGifAt=0;e.pvpWarriorDeathUntil=0;
           e.knockTime=0;e.knockVX=0;e.knockVY=0;
           const node=entityNodes.get(e.id);
           if(node){
             node.querySelectorAll('img').forEach(releaseGifObjectUrl);
             node.remove();entityNodes.delete(e.id);
           }
           if(e.controlled)pvpResetLocalSpectatorAfterRevive();
          }
          """
          once(anchor,helpers,'History helpers')

          once(
          "       recordPVPDamage(e,Number(data.amount)||0);",
          "       historyApplyHitFeedback(e,data.impact,data.sourceId);\n       recordPVPDamage(e,Number(data.amount)||0);",
          'damage feedback')

          once(
          "     if(e){e.alive=false;e.hp=0;e.moving=false}",
          "     if(e){e.hp=0;e.moving=false;if(!e.deathStarted)startEntityDeath(e,Number(e.hitDirX)||0,Number(e.hitDirY)||0)}",
          'player death event')

          once(
          "     e.alive=sp.alive!==false;e.hp=Math.max(0,Number(sp.hp)||0);e.maxHp=Math.max(1,Number(sp.maxHp)||350);",
          "     const serverAlive=sp.alive!==false;\n     if(wasAlive===false&&serverAlive)historyResetDeathVisual(e);\n     e.alive=serverAlive;e.hp=Math.max(0,Number(sp.hp)||0);e.maxHp=Math.max(1,Number(sp.maxHp)||350);",
          'player alive transition')

          once(
          "     if(e.controlled){\n       e.historyAuthX=Number(sp.x)||0;e.historyAuthY=Number(sp.y)||0;e.historyAuthInputSeq=Number(sp.lastInputSeq)||0;e.historyAuthArrivalAt=arrival;",
          "     if(wasAlive===true&&!serverAlive&&!e.deathStarted)startEntityDeath(e,Number(e.hitDirX)||0,Number(e.hitDirY)||0);\n     if(e.controlled){\n       e.historyAuthX=Number(sp.x)||0;e.historyAuthY=Number(sp.y)||0;e.historyAuthInputSeq=Number(sp.lastInputSeq)||0;e.historyAuthArrivalAt=arrival;",
          'player snapshot death')

          once(
          "     const sid='dragon:'+String(sd.id);let e=oldByServerId.get(sid);",
          "     const sid='dragon:'+String(sd.id);let e=oldByServerId.get(sid),wasAlive=e?.alive;",
          'dragon wasAlive')

          once(
          "     e.alive=sd.alive!==false;e.hp=Math.max(0,Number(sd.hp)||0);e.maxHp=Math.max(1,Number(sd.maxHp)||100);",
          "     const serverAlive=sd.alive!==false;\n     if(wasAlive===false&&serverAlive)historyResetDeathVisual(e);\n     e.alive=serverAlive;e.hp=Math.max(0,Number(sd.hp)||0);e.maxHp=Math.max(1,Number(sd.maxHp)||100);",
          'dragon alive transition')

          once(
          "     const attackSerial=Number(sd.attackSerial)||0,attackRemaining=Math.max(0,(Number(sd.attackUntil)||0)-this.lastServerTime);",
          "     if(wasAlive===true&&!serverAlive&&!e.deathStarted)startEntityDeath(e,Number(e.hitDirX)||0,Number(e.hitDirY)||0);\n     const attackSerial=Number(sd.attackSerial)||0,attackRemaining=Math.max(0,(Number(sd.attackUntil)||0)-this.lastServerTime);",
          'dragon snapshot death')

          once(
          "     const charging=pvpIsWarriorHero(me)&&Number(me.pvpWarriorChargeUntil)>now,locked=Number(me.knockTime)>0;",
          """     let knocked=false;
             if(Number(me.knockTime)>0){
               const step=Math.min(dt,Number(me.knockTime)||0),b=pvpArenaBounds(me.r||30);
               me.x=clamp(me.x+(Number(me.knockVX)||0)*step,b.left,b.right);
               me.y=clamp(me.y+(Number(me.knockVY)||0)*step,b.top,b.bottom);
               me.knockTime=Math.max(0,(Number(me.knockTime)||0)-dt);
               const damping=Math.pow(.16,dt);me.knockVX=(Number(me.knockVX)||0)*damping;me.knockVY=(Number(me.knockVY)||0)*damping;
               if(me.knockTime<=0){me.knockVX=0;me.knockVY=0}
               me.moving=false;knocked=true;
             }
             const charging=pvpIsWarriorHero(me)&&Number(me.pvpWarriorChargeUntil)>now,locked=knocked;""",
          'local knockback')

          once(
          "     if(Number.isFinite(ax)&&Number.isFinite(ay)){",
          "     if(!knocked&&Number.isFinite(ax)&&Number.isFinite(ay)){",
          'skip reconcile during knockback')

          once(
          "       this.lastInputSignature=signature;this.lastInputAt=now;this.send({type:'input',dx,dy,seq:++this.inputSeq});",
          "       this.lastInputSignature=signature;this.lastInputAt=now;\n       const seq=++this.inputSeq;\n       this.send({type:'input',dx,dy,seq,pose:{x:me.x,y:me.y,heading:Number(me.heading)||0,facing:Number(me.facing)<0?-1:1}});",
          'client pose packet')

          once(
          "if(state.mode==='pvp'&&e.pvpMode&&!e.pvpMinion&&e.ownerId)pvpRegisterRoundDeath(e,now);",
          "if(state.mode==='pvp'&&!state.historyActive&&e.pvpMode&&!e.pvpMinion&&e.ownerId)pvpRegisterRoundDeath(e,now);",
          'History round death exclusion')

          p.write_text(s,encoding='utf-8')

          t=Path('tests/history-smoke.cjs')
          x=t.read_text(encoding='utf-8')
          checks="""
          assert(html.includes('HISTORY_RENDER_DELAY_MIN_MS=35')&&html.includes('HISTORY_RENDER_DELAY_MAX_MS=80')&&html.includes('HISTORY_INPUT_KEEPALIVE_MS=50'),
            'History must use the lower latency interpolation/input profile');
          assert(html.includes("pose:{x:me.x,y:me.y")&&worker.includes('applyClientPose(player, message.pose, inputSeq)'),
            'History must send a validated predicted client pose to reduce projectile/player mismatch');
          assert(worker.includes('const DRAGON_SPEED = 97.5'),
            'History dragon speed must match PvP dragon speed');
          assert(html.includes('historyApplyHitFeedback(e,data.impact,data.sourceId)')&&worker.includes('armKnockback(target'),
            'History must reuse hit reaction and authoritative knockback feedback');
          assert(html.includes('startEntityDeath(e,Number(e.hitDirX)||0,Number(e.hitDirY)||0)')&&html.includes("!state.historyActive&&e.pvpMode"),
            'History deaths must use PvP death visuals without consuming PvP round lives');
          """
          if "validated predicted client pose" not in x:
              x=x.replace("console.log('History smoke checks passed.');",checks+"\nconsole.log('History smoke checks passed.');")
          t.write_text(x,encoding='utf-8')
          PY
      - name: Run regression tests
        run: |
          node tests/history-smoke.cjs
          node tests/pvp-smoke.cjs
          node tests/progression-smoke.cjs
      - name: Validate History Worker
        working-directory: history-server
        run: |
          npm install
          npx wrangler deploy --dry-run
      - name: Verify boot in Chromium
        shell: bash
        run: |
          python3 -m http.server 8080 >/tmp/http.log 2>&1 &
          PID=$!
          sleep 2
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --enable-logging=stderr --v=1             --virtual-time-budget=9000 --dump-dom http://127.0.0.1:8080/ >/tmp/dom.html 2>/tmp/chrome.log || true
          kill "$PID" 2>/dev/null || true
          grep -E -i 'Uncaught|ReferenceError|TypeError|SyntaxError|INFO:CONSOLE' /tmp/chrome.log | tail -120 || true
          if grep -E -q 'Uncaught (TypeError|ReferenceError|SyntaxError)' /tmp/chrome.log; then exit 1; fi
      - name: Commit and clean temporary workflows
        run: |
          rm -f .github/workflows/one-time-history-hit-sync.yml
          rm -f .github/workflows/one-time-history-hit-sync-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/history-smoke.cjs .github/workflows/
          git commit -m "Finish History hit sync and PvP feedback"
          git push origin HEAD:main
