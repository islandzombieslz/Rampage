name: Revert last war optimizations

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/revert-last-war-optimizations.yml'

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Revert only the optimization commits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main

          # Reverse only the commits created for the last optimization request.
          # This preserves unrelated commits that may have landed in parallel.
          commits=(
            9fe1302bd119aa85919d472d1cd25a7471b314e3
            277d83eb460f39e1f260a621c101c4d3af1c3cfa
            d1abcf2ddde60b6170b71f626f858ac95f2249e7
            7657ca3e457c20cff8d65b4d77fb0ed133706cd4
            b85e4fee1c4bdece62d3ef38399d22ce4cbe895c
            630b5a8035b5917c0823a6524635d8735634e7e6
            f61e4024de10ac7f87e3315b1d69ce2487b343e0
            7ef12d3ec06365531ccfe33b5f60376489281473
          )

          for c in "${commits[@]}"; do
            git revert --no-edit "$c"
          done

          rm -f .github/workflows/revert-last-war-optimizations.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Remove one-shot optimization revert workflow"
          fi
          git push origin main

      - name: Verify LOD markers are gone
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'WAR ADAPTIVE VISUAL LOD 2026-09-12' index.html
          ! grep -q 'WAR_LOD_POSTER_CACHE' index.html
          ! grep -q 'war-lod-medium' index.html
          ! grep -q 'war-lod-heavy' index.html
