name: Audit war menu duplicates

on:
  push:
    branches:
      - war-menu-buttons-smaller-20260908

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: war-menu-buttons-smaller-20260908
      - name: Audit menu CSS and HTML duplicates
        run: python .github/audit_war_menu_duplicates.py
