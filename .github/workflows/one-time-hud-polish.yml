name: One-time HUD polish
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-hud-polish.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply requested HUD polish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def swap(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          path = Path("index.html")
          s = path.read_text(encoding="utf-8")

          s = swap(s,
          """#pvpCombatHud .pvp-special-wrap{position:relative;width:clamp(78px,10vw,104px);height:clamp(48px,8vh,62px);
           display:flex;align-items:flex-end;justify-content:flex-start}
          #pvpCombatHud .pvp-special-button{position:relative;width:clamp(66px,8vw,84px);height:16px;min-height:16px;margin:0 20px 4px 0;
           padding:0;overflow:hidden;border:2px solid #4b4030;border-radius:999px;background:#17191c;box-shadow:inset 0 1px 4px #000b,0 2px 6px #0007}""",
          """#pvpCombatHud .pvp-special-wrap{position:relative;width:clamp(72px,9.5vw,92px);height:clamp(48px,7vw,64px);
           display:flex;align-items:flex-end;justify-content:flex-start}
          #pvpCombatHud .pvp-special-button{position:relative;width:clamp(48px,7vw,64px);height:clamp(48px,7vw,64px);min-height:0;margin:0;
           padding:0;overflow:hidden;border:2px solid #4b4030;border-radius:12px;background:#17191c;box-shadow:inset 0 1px 4px #000b,0 2px 6px #0007}""",
          "special button size")

          s = swap(s,
          """#pvpCombatHud .pvp-special-icon{position:absolute;right:0;bottom:-1px;width:clamp(40px,5.2vw,54px);height:clamp(40px,5.2vw,54px);
           object-fit:contain;z-index:4;pointer-events:none;user-select:none;filter:drop-shadow(0 3px 4px #0008)}""",
          """#pvpCombatHud .pvp-special-icon{position:absolute;right:0;bottom:-2px;width:clamp(42px,5.8vw,56px);height:clamp(42px,5.8vw,56px);
           object-fit:contain;z-index:4;pointer-events:none;user-select:none;filter:drop-shadow(0 3px 4px #0008)}""",
          "special icon size")

          s = swap(s,
          """#accountXpHud{position:absolute;top:calc(var(--safe-top) + 6px);left:calc(var(--safe-left) + 8px);z-index:55;
           display:flex;align-items:center;gap:7px;pointer-events:none;font-family:inherit}
          #accountXpHud[hidden]{display:none!important}
          #accountXpLevelBadge{position:relative;width:46px;height:46px;flex:0 0 46px;display:grid;place-items:center}""",
          """#accountXpHud{position:absolute;top:calc(var(--safe-top) + 6px);left:calc(var(--safe-left) + 8px);z-index:55;
           display:flex;align-items:center;gap:0;pointer-events:none;font-family:inherit}
          #accountXpHud[hidden]{display:none!important}
          #accountXpLevelBadge{position:relative;width:46px;height:46px;flex:0 0 46px;display:grid;place-items:center;z-index:2}""",
          "XP star overlap")

          s = swap(s,
          """#accountXpTrack{position:relative;width:clamp(105px,15vw,174px);height:18px;border-radius:999px;
           overflow:hidden;background:#25231b;border:2px solid #120c07;box-shadow:0 1px 5px #0009}""",
          """#accountXpTrack{position:relative;width:clamp(105px,15vw,174px);height:18px;border-radius:999px;margin-left:-14px;z-index:1;
           overflow:hidden;background:#25231b;border:2px solid #120c07;box-shadow:0 1px 5px #0009}""",
          "XP bar overlap")

          s = swap(s,
          """#accountXpSync{position:absolute;left:53px;top:24px;font-size:9px;color:#d4d9dd;white-space:nowrap;text-shadow:0 1px 2px #000}
          #accountXpSync[data-state="pending"]{color:#ffd67c}
          #accountXpSync[data-state="error"]{color:#ff7d7d;max-width:270px;white-space:normal;line-height:1.25}
          #accountXpReward{position:absolute;left:53px;top:40px;background:#151a1ede;color:#ffdd63;font-size:11px;font-weight:800;
           padding:5px 8px;border:1px solid #ffe16c88;border-radius:8px;white-space:nowrap;text-shadow:0 1px 3px #000}
          #accountXpReward[hidden]{display:none!important}""",
          """#accountXpSync,#accountXpReward{display:none!important}""",
          "hide XP HUD text")

          s = swap(s,
          """function updateAccountXPSyncStatus(){
           const tag=$('#accountXpSync');if(!tag)return;
           const ap=accountProgress;
           const message=ap.status==='ready'?'XP salvo na conta':
            ap.status==='saving'?'Salvando XP na conta…':
            ap.status==='error'?(ap.error||'Erro ao acessar XP da conta'):
            ap.status==='auth'?'Conectando à sua conta…':
            ap.connected?'Carregando XP da conta…':'Aguardando conexão com Firebase…';
           tag.textContent=message;tag.dataset.state=ap.status==='error'?'error':ap.status==='ready'?'saved':'pending';
           const accountStatus=$('#accountStatus');
           if(accountStatus&&ap.status==='error')accountStatus.textContent=message;
          }
          function showAccountXPReward(){
           const notice=$('#accountXpReward'),award=accountProgress.lastAward;
           if(!notice||!award||isGameScreenVisible())return;
           notice.textContent=(award.won?'Vitória':'Partida concluída')+' • +'+award.xp+' XP salvo na conta';
           notice.hidden=false;accountProgress.lastAward=null;
           const serial=Date.now();notice.dataset.serial=String(serial);
           setTimeout(()=>{if(notice.dataset.serial===String(serial))notice.hidden=true},5500);
          }""",
          """function updateAccountXPSyncStatus(){
           const tag=$('#accountXpSync'),ap=accountProgress;
           const message=ap.status==='error'?(ap.error||'Erro ao acessar XP da conta'):'';
           if(tag){tag.textContent='';tag.hidden=true;tag.dataset.state=ap.status==='error'?'error':ap.status==='ready'?'saved':'pending'}
           const accountStatus=$('#accountStatus');
           if(accountStatus&&ap.status==='error')accountStatus.textContent=message;
          }
          function showAccountXPReward(){
           const notice=$('#accountXpReward');
           if(notice){notice.textContent='';notice.hidden=true}
           accountProgress.lastAward=null;
          }""",
          "remove XP status/reward messages")

          path.write_text(s, encoding="utf-8")

          path = Path("tests/progression-smoke.cjs")
          s = path.read_text(encoding="utf-8")
          s = swap(s,
          """ assert.match(mockNodes['#accountXpSync'].textContent,/regras do Firebase/i);
           assert.equal(mockNodes['#accountXpHud'].hidden,false,'HUD visible on initial menu');""",
          """ assert.equal(mockNodes['#accountXpSync'].textContent,'','XP sync status text stays out of the level HUD');
           assert.equal(mockNodes['#accountXpSync'].hidden,true,'XP sync status node stays hidden');
           assert.match(mockNodes['#accountStatus'].textContent,/regras do Firebase/i,'Firebase errors remain available in the account menu');
           assert.equal(mockNodes['#accountXpHud'].hidden,false,'HUD visible on initial menu');""",
          "progression test")
          path.write_text(s, encoding="utf-8")

          path = Path("tests/pvp-smoke.cjs")
          s = path.read_text(encoding="utf-8")
          anchor = """assert(html.includes('class="pvp-special-fill"')&&
           html.includes("button.style.setProperty('--pvp-special-progress'"),
           'special HUD must use the existing cooldown/unlock state to fill its progress bar');
          """
          addition = """assert(html.includes("#pvpCombatHud .pvp-special-button{position:relative;width:clamp(48px,7vw,64px);height:clamp(48px,7vw,64px)"),
           'special control must match the stone power/weapon slot size');
          """
          if addition not in s:
              if anchor not in s:
                  raise SystemExit("PvP test anchor not found")
              s = s.replace(anchor, anchor + addition, 1)
          path.write_text(s, encoding="utf-8")
          PY
      - name: Run focused regression tests
        run: |
          node tests/progression-smoke.cjs
          node tests/pvp-smoke.cjs
      - name: Commit final changes and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-time-hud-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/progression-smoke.cjs tests/pvp-smoke.cjs .github/workflows/one-time-hud-polish.yml
          git commit -m "Polish XP HUD and enlarge PvP special control"
          git push origin HEAD:main
